# Contrato GOVERNADO de DECISÕES RESERVADAS AO HUMANO (CO-3 / PR #42).
#
# SSOT machine-readable do contrato de cada DECISÃO que o repositório reserva ao
# humano (owner/reviewer). Projetado por `guidelines decide`:
#
#   contrato permanente (este arquivo: títulos, seções, escolhas, consequências,
#     limites, elegibilidade, publicação, confirmação)
#   + snapshot governado situado (findings/resolutions/eventos/CI/PR/gate/tasks)
#   → briefing humano determinístico → escolha → prévia → confirmação → registro.
#
# Categoria PRÓPRIA (não estende `work-policy.yml`): aquela governa o MODO de
# TRABALHO de um agente implementador; esta governa a AUTORIDADE de DECISÃO
# humana. Misturá-las seria erro de categoria (um contrato de execução de agente
# ≠ um contrato de decisão reservada ao humano).
#
# Esta policy NÃO duplica fatos derivados (findings, resolutions, CI, reviews,
# tasks, gate, PR): o briefing os projeta do snapshot. Ela declara o CONTRATO
# humano estável: o que cada decisão é, o que ela autoriza e o que NÃO autoriza.
# O runtime apenas PROJETA (zero LLM — ADR 0018): nenhuma narrativa é gerada por
# modelo; toda frase derivada vem de campos estruturados das fontes governadas.
#
# `publication.commit`/`push`:
#   - after-confirmation → só APÓS confirmação humana explícita (interativa) ou
#     `--authorization explicit-human-decision` + `--confirm` (modo direto).
# `publication.mixed_diff: forbidden` é invariante: o commit do efeito governado
# nunca mistura escopos.
# `requires_owner: true` exige que o actor resolvido (git identity) seja o `owner`
# declarado — autoridade não é assumível por flag.
version: 1

owner:
  handle: "@rosanarezende"
  email: rosanarezende.com@gmail.com

decision_types:
  review-revalidation:
    title: Decidir se reviews stale precisam de revalidação
    purpose: >
      O sistema analisa o delta posterior à última cobertura de cada review
      obrigatória aprovada e recomenda dispensar ou repetir a revalidação. A
      recomendação não altera estado: a owner confirma, substitui ou mantém a
      decisão pendente. Stale continua sendo fato mesmo quando a repetição é
      dispensada.
    requires_owner: true
    sections:
      - key: decision_summary
        heading: O que você está decidindo?
      - key: system_recommendation
        heading: O que o sistema recomenda e por quê?
      - key: observed_delta
        heading: O que mudou desde a revisão anterior?
      - key: risks
        heading: Que riscos ainda exigem atenção humana?
      - key: consequences
        heading: O que acontece após a decisão?
      - key: not_authorized
        heading: O que esta decisão NÃO autoriza?
    choices:
      - id: accept-recommendations
        label: Aceitar as recomendações calculadas pelo sistema
        mutating: true
      - id: waive-all
        label: Dispensar explicitamente todas as revalidações listadas
        mutating: true
      - id: require-all
        label: Exigir explicitamente todas as revalidações listadas
        mutating: true
      - id: keep-pending
        label: Manter a decisão pendente
        mutating: false
      - id: request-explanation
        label: Solicitar mais esclarecimentos (não escreve nada)
        mutating: false
      - id: cancel
        label: Cancelar (não escreve nada)
        mutating: false
    consequences:
      - Dispensar remove somente o bloqueio de revalidação daquele delta; não torna a review current.
      - Exigir mantém o bloqueio até uma verificação cobrir a cabeça funcional.
      - A decisão, o actor, o delta analisado e a justificativa ficam registrados em state.yml.
    not_authorized:
      - Alterar ou reescrever o review original.
      - Declarar readiness do checkpoint.
      - Converter o PR para Ready.
      - Exercer Human Gate.
      - Fazer merge.
      - Dispensar automaticamente sem confirmação humana.
    publication:
      commit: after-confirmation
      push: after-confirmation
      mixed_diff: forbidden
    confirmation: required
    technical_details: available

  close-dispositions:
    title: Encerrar problemas revalidados da auditoria técnica
    purpose: >
      O reviewer/owner encerra (disposition open → accepted) os problemas que já
      foram corrigidos pelo implementador E revalidados por verificação
      independente. É a única autoridade que destrava o gate sobre findings: o
      implementador propõe resolution, mas só esta decisão fecha a disposition.
    requires_owner: true
    sections:
      - key: decision_summary
        heading: O que você está decidindo?
      - key: why_now
        heading: Por que esta decisão apareceu agora?
      - key: problems
        heading: O que estava errado ou em risco?
      - key: changes
        heading: O que foi feito?
      - key: verification
        heading: Como sabemos que funcionou?
      - key: residual_risks
        heading: O que ainda permanece em risco?
      - key: consequences
        heading: O que acontece se você aprovar?
      - key: not_authorized
        heading: O que esta decisão NÃO autoriza?
    choices:
      - id: accept-all
        label: Aceitar as correções e encerrar todos os problemas
        mutating: true
      - id: review-individually
        label: Avaliar cada problema separadamente
        mutating: true
      - id: request-explanation
        label: Solicitar mais esclarecimentos (não escreve nada)
        mutating: false
      - id: request-changes
        label: Solicitar novas correções (mantém os problemas abertos)
        mutating: false
      - id: cancel
        label: Cancelar (não escreve nada)
        mutating: false
    consequences:
      - Os problemas deixam de bloquear o avanço.
      - A auditoria técnica da etapa corrigida pode ser encerrada.
      - A próxima etapa passa a ser a tarefa seguinte.
      - Esta decisão NÃO aprova o PR inteiro.
    not_authorized:
      - Converter o PR para Ready.
      - Exercer o Human Gate do checkpoint.
      - Criar o gate artifact.
      - Fazer merge.
      - Abrir o próximo PR.
    publication:
      commit: after-confirmation
      push: after-confirmation
      mixed_diff: forbidden
    confirmation: required
    technical_details: available

  finish-step:
    title: Concluir etapa atual e iniciar a próxima
    purpose: >
      O owner encerra a etapa ativa e ativa a próxima em uma única
      decisão governada quando os critérios de saída já estão satisfeitos. Esta
      decisão substitui o fluxo humano em duas autorizações para o caso comum
      interno do checkpoint: não cria uma readiness intermediária persistida, não
      exerce Human Gate, não converte PR para Ready, não abre outro PR e não mexe
      na topologia. Aplicar altera EXCLUSIVAMENTE os marcadores de dois
      itens de etapa em tasks.md (atual `[/] → [x]`, próximo `[ ] → [/]`) e
      nada mais.
    requires_owner: true
    sections:
      - key: completed
        heading: O que será concluído?
      - key: exit_criteria
        heading: Como sabemos que pode encerrar?
      - key: next_starts
        heading: O que começará agora?
      - key: consequences
        heading: O que acontece se você aprovar?
      - key: not_authorized
        heading: O que esta decisão NÃO autoriza?
    choices:
      - id: finish
        label: Concluir a etapa atual e iniciar a próxima
        mutating: true
      - id: keep
        label: Manter a etapa atual em implementação
        mutating: false
      - id: request-explanation
        label: Solicitar mais esclarecimentos (não escreve nada)
        mutating: false
      - id: cancel
        label: Cancelar (não escreve nada)
        mutating: false
    consequences:
      - A etapa atual será marcada como concluída.
      - A próxima etapa será marcada como ativa.
      - "`npm run flow -- work` passará a apontar o próximo como objeto de implementação."
      - A readiness do atual é validada como critério, mas não vira commit separado.
    not_authorized:
      - Implementar a próxima etapa automaticamente.
      - Exercer o Human Gate.
      - Converter o PR para Ready.
      - Criar o gate artifact.
      - Fazer merge.
      - Abrir outro PR.
      - Alterar a topologia (state.yml).
    publication:
      commit: after-confirmation
      push: after-confirmation
      mixed_diff: forbidden
    confirmation: required
    technical_details: available

  mark-readiness:
    title: Declarar readiness da etapa ativa
    purpose: >
      O owner declara que a etapa ativa satisfez seus critérios de
      saída e está pronto para a decisão de transição. É uma transição de
      lifecycle em tasks.md, NÃO um avanço: não marca a etapa como
      concluído, não ativa o próximo, não exerce Human Gate e não mexe na
      topologia. Aplicar altera EXCLUSIVAMENTE a linha da etapa ativa em
      tasks.md, adicionando `readiness: ready-for-transition`.
    requires_owner: true
    sections:
      - key: active_scope
        heading: O que está pronto?
      - key: exit_criteria
        heading: Como sabemos que pode declarar readiness?
      - key: next_decision
        heading: O que acontece depois?
      - key: consequences
        heading: O que acontece se você aprovar?
      - key: not_authorized
        heading: O que esta decisão NÃO autoriza?
    choices:
      - id: mark-ready
        label: Declarar readiness da etapa ativa
        mutating: true
      - id: keep
        label: Manter a etapa em implementação
        mutating: false
      - id: request-explanation
        label: Solicitar mais esclarecimentos (não escreve nada)
        mutating: false
      - id: cancel
        label: Cancelar (não escreve nada)
        mutating: false
    consequences:
      - A etapa ativa continua `[/]`, mas passa a declarar readiness.
      - "`npm run flow -- work` passará a projetar a próxima decisão governada."
      - A abertura da próxima etapa poderá ser decidida quando houver próximo `[ ]`.
    not_authorized:
      - Marcar a etapa atual como `[x]`.
      - Ativar a próxima etapa.
      - Exercer o Human Gate.
      - Converter o PR para Ready.
      - Criar gate artifact.
      - Fazer merge.
      - Abrir outro PR.
      - Alterar a topologia (state.yml).
    publication:
      commit: after-confirmation
      push: after-confirmation
      mixed_diff: forbidden
    confirmation: required
    technical_details: available

  advance-step:
    title: Iniciar a próxima etapa
    purpose: >
      O owner conclui a etapa atual e ativa a próxima dentro do MESMO
      checkpoint. É uma transição de ESTADO INTERNO de execução (tasks.md), NÃO um
      Human Gate: não conclui o nó, não exerce gate, não mexe na topologia. Aplicar
      altera EXCLUSIVAMENTE os marcadores de dois itens de etapa em tasks.md
      (atual `[/] → [x]`, próximo `[ ] → [/]`) e nada mais.
    requires_owner: true
    sections:
      - key: completed
        heading: O que foi concluído?
      - key: exit_criteria
        heading: Como sabemos que ele pode ser encerrado?
      - key: next_starts
        heading: O que começará agora?
      - key: consequences
        heading: O que acontece se você aprovar?
      - key: not_authorized
        heading: O que esta decisão NÃO autoriza?
    choices:
      - id: advance
        label: Concluir a etapa atual e ativar a próxima
        mutating: true
      - id: keep
        label: Manter a etapa atual ativa
        mutating: false
      - id: request-explanation
        label: Solicitar mais esclarecimentos (não escreve nada)
        mutating: false
      - id: cancel
        label: Cancelar (não escreve nada)
        mutating: false
    consequences:
      - A etapa atual será marcada como concluída.
      - A próxima etapa será marcada como ativa.
      - "`npm run flow -- work` passará a apontar o próximo como objeto de implementação."
    not_authorized:
      - Implementar a próxima etapa automaticamente.
      - Exercer o Human Gate.
      - Converter o PR para Ready.
      - Criar o gate artifact.
      - Fazer merge.
      - Abrir outro PR.
      - Alterar a topologia (state.yml).
    publication:
      commit: after-confirmation
      push: after-confirmation
      mixed_diff: forbidden
    confirmation: required
    technical_details: available

  human-gate:
    title: Decidir o avanço do checkpoint (Human Gate)
    purpose: >
      O owner decide o PRÓXIMO MOVIMENTO do checkpoint quando o PR está pronto:
      autorizar a conclusão do nó e a preparação da transição. O gate artifact
      nasce DEPOIS da decisão. Registrar o gate NÃO executa transição, merge nem
      abertura de PR — esses permanecem atos posteriores e explícitos.
    requires_owner: true
    sections:
      - key: delivered_value
        heading: O que este checkpoint entregou?
      - key: experience_change
        heading: O que muda para quem usa?
      - key: reviews
        heading: Quais revisões foram feitas?
      - key: validation
        heading: Como foi validado?
      - key: residual_risks
        heading: O que ainda permanece em risco?
      - key: next_node
        heading: Qual é o próximo passo?
      - key: consequences
        heading: O que acontece se você aprovar?
      - key: not_authorized
        heading: O que esta decisão NÃO autoriza?
    choices:
      - id: approve
        label: Aprovar o avanço do checkpoint
        mutating: true
      - id: request-changes
        label: Solicitar mudanças antes de aprovar
        mutating: true
      - id: reject
        label: Rejeitar o avanço
        mutating: true
      - id: cancel
        label: Cancelar (não escreve nada)
        mutating: false
    consequences:
      - Autoriza concluir o checkpoint e preparar a próxima transição.
    not_authorized:
      - Merge.
      - Alteração automática da topologia.
      - Abertura automática do próximo PR.
      - Mudança de policy.
      - Fechamento de outro checkpoint.
    publication:
      commit: after-confirmation
      push: after-confirmation
      mixed_diff: forbidden
    confirmation: required
    technical_details: available

  open-next-topology-node:
    title: Abrir o próximo nó da topologia
    purpose: >
      Após Human Gate aprovado em um nó não-terminal, a owner abre o próximo PR
      stacked planejado por transição governada. Esta decisão cria/publica a
      branch do próximo nó, abre um PR Draft factual, registra o número real do
      PR em state.yml, atualiza active.yml, materializa o próximo checkpoint em
      tasks.md, comita o efeito exclusivo e faz push normal. Ela NÃO executa
      merge, NÃO abre nó fora da topologia, NÃO altera main, NÃO cria Human Gate
      e NÃO implementa o próximo nó.
    requires_owner: true
    sections:
      - key: completed_node
        heading: Qual nó da topologia foi aprovado?
      - key: next_node
        heading: Qual nó da topologia será aberto?
      - key: preflight
        heading: O que precisa estar verdadeiro antes da abertura?
      - key: planned_effects
        heading: Quais efeitos a transição governada deverá produzir?
      - key: consequences
        heading: O que acontece se você aprovar?
      - key: not_authorized
        heading: O que esta decisão NÃO autoriza?
    choices:
      - id: open-node
        label: Abrir o próximo nó da topologia
        mutating: true
      - id: keep
        label: Manter o nó atual como ativo por enquanto
        mutating: false
      - id: request-explanation
        label: Solicitar mais esclarecimentos (não escreve nada)
        mutating: false
      - id: cancel
        label: Cancelar (não escreve nada)
        mutating: false
    consequences:
      - A branch do próximo nó será criada e publicada sobre o HEAD aprovado.
      - Um PR Draft stacked será aberto contra a branch do nó aprovado.
      - state.yml, active.yml e tasks.md serão reconciliados com o número factual do PR.
      - O efeito governado será registrado em commit exclusivo e push normal.
      - "`work`, `decide` e cockpit deixam de divergir quando o gate já está aprovado."
    not_authorized:
      - Fazer merge.
      - Alterar main.
      - Abrir nó fora da topologia planejada.
      - Executar Human Gate.
      - Converter PR para Ready.
      - Implementar o próximo nó da topologia.
      - Inferir número de PR sem confirmação factual do GitHub.
    publication:
      commit: after-confirmation
      push: after-confirmation
      mixed_diff: forbidden
    confirmation: required
    technical_details: available
