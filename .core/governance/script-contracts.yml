schema_version: 1
description: >
  Contrato operacional dos scripts, hooks, workflows e templates do framework.
  Este arquivo e a SSOT; package.json, docs/scripts.md, hooks locais e templates
  de consumidor sao projecoes deterministicas.

profiles:
  maintainer:
    package_scripts:
      - name: flow
        command: node dist/cli/main.js
        category: cli
        mutates: false
        consumers: [human]
        description: Wizard governado local da CLI.
      - name: setup
        command: npm ci && npm run build:all
        category: setup
        mutates: true
        consumers: [human]
        description: Primeira instalacao local do repositório.
      - name: build
        command: tsc
        category: build
        mutates: true
        consumers: [script]
        description: Compila TypeScript de src/ para dist/.
      - name: build:rules
        command: node dist/cli/bin.js build-rules
        category: build
        mutates: true
        consumers: [script, hook]
        description: Gera rules.json, catalogo e ledger derivado.
      - name: build:all
        command: npm run build && npm run build:rules
        category: build
        mutates: true
        consumers: [script, hook, lifecycle]
        description: Build completo do runtime e das regras.
      - name: format
        command: prettier --write .
        category: format
        mutates: true
        consumers: [human]
        description: Formata todos os arquivos.
      - name: format:check
        command: prettier --check .
        category: format
        mutates: false
        consumers: [script]
        description: Verifica formatacao sem alterar arquivos.
      - name: lint-staged
        command: lint-staged
        category: format
        mutates: true
        consumers: [hook]
        description: Formata arquivos staged e re-stageia alteracoes.
      - name: test
        command: npm run test:unit && npm run test:ts
        category: test
        mutates: false
        consumers: [script]
        description: Agregado das suites mjs e TypeScript.
      - name: test:unit
        command: node --experimental-default-config-file --test "tests/integration/**/*.test.mjs"
        category: test
        mutates: false
        consumers: [script, hook]
        description: Suite mjs rapida usada no pre-commit.
      - name: test:ts
        command: jest --config ./.jest/jest.config.js
        category: test
        mutates: false
        consumers: [script]
        description: Suite TypeScript/Jest.
      - name: test:smoke
        command: npm run build && node --experimental-default-config-file --test "tests/smoke/*.test.mjs"
        category: test
        mutates: true
        consumers: [script, workflow]
        description: Smoke cross-plataforma sobre pacote gerado.
      - name: consumer:journey
        command: npm run build && node dist/cli/bin.js consumer-journey all
        category: test
        mutates: true
        consumers: [human, script]
        description: "Valida a jornada de consumidor em tres niveis: tarball, yalc e Verdaccio."
      - name: consumer:journey:pack
        command: npm run build && node dist/cli/bin.js consumer-journey pack
        category: test
        mutates: true
        consumers: [human, script]
        description: "Nivel 1 obrigatorio: npm pack e consumidores temporarios reais."
      - name: consumer:journey:yalc
        command: npm run build && node dist/cli/bin.js consumer-journey yalc
        category: test
        mutates: false
        consumers: [human]
        description: "Nivel 2 opcional: loop local rapido com yalc."
      - name: consumer:journey:verdaccio
        command: npm run build && node dist/cli/bin.js consumer-journey verdaccio
        category: test
        mutates: false
        consumers: [human]
        description: "Nivel 3 opcional: registry local com Verdaccio antes do npm real."
      - name: test:coverage
        command: node --experimental-default-config-file --experimental-test-coverage --test "tests/integration/**/*.test.mjs" && jest --config ./.jest/jest.config.js --coverage
        category: test
        mutates: false
        consumers: [human]
        description: Cobertura combinada das suites mjs e Jest.
      - name: living-docs:generate
        command: npm run build && node dist/cli/bin.js living-docs generate
        category: docs
        mutates: true
        consumers: [human]
        description: Regenera living docs.
      - name: living-docs:check
        command: npm run build && node dist/cli/bin.js living-docs check
        category: docs
        mutates: true
        consumers: [script]
        description: Verifica drift dos living docs.
      - name: site:flow:sync
        command: npm run build && node dist/cli/bin.js site-flow-copy sync
        category: docs
        mutates: true
        consumers: [human]
        description: Sincroniza o modulo React do Flow com os textos reais da CLI.
      - name: site:flow:check
        command: npm run build && node dist/cli/bin.js site-flow-copy check
        category: docs
        mutates: false
        consumers: [script]
        description: Falha se o site React do Flow divergir dos textos reais da CLI.
      - name: site:scenarios:sync
        command: npm run build && node dist/cli/bin.js site-scenarios sync
        category: docs
        mutates: true
        consumers: [human]
        description: Gera os transcripts de terminal do site a partir de execucoes reais do runtime.
      - name: site:scenarios:check
        command: npm run build && node dist/cli/bin.js site-scenarios check
        category: docs
        mutates: false
        consumers: [script]
        description: Falha se os transcripts de terminal do site divergirem do runtime real.
      - name: site:prompts:sync
        command: npm run build && node dist/cli/bin.js site-prompts sync
        category: docs
        mutates: true
        consumers: [human]
        description: Gera a maquina de prompts do site a partir do wizard real (command.prompt).
      - name: site:prompts:check
        command: npm run build && node dist/cli/bin.js site-prompts check
        category: docs
        mutates: false
        consumers: [script]
        description: Falha se a maquina de prompts do site divergir do wizard real.
      - name: site:assets:sync
        command: node site/scripts/optimize-assets.mjs sync
        category: docs
        mutates: true
        consumers: [human]
        description: Gera WebP otimizado para as imagens do site a partir de docs/assets.
      - name: site:assets:check
        command: node site/scripts/optimize-assets.mjs check
        category: docs
        mutates: false
        consumers: [script, workflow]
        description: Falha se os WebPs do site estiverem ausentes ou desatualizados.
      - name: site:real-package
        command: npm run build:all && node site/scripts/prepare-real-cli-package.mjs
        category: docs
        mutates: true
        consumers: [human, script]
        description: Prepara o pacote que o modo real do simulador executa em preview/local.
      - name: site:dev
        command: npm run site:real-package && vite --config site/vite.config.ts --host 127.0.0.1
        category: docs
        mutates: false
        consumers: [human]
        description: Servidor local do site governado em React/Vite.
      - name: site:build
        command: npm run site:flow:check && npm run site:scenarios:check && npm run site:prompts:check && npm run site:assets:check && npm run site:real-package && vite build --config site/vite.config.ts
        category: docs
        mutates: true
        consumers: [script, workflow]
        description: Valida textos/transcripts/imagens do site e gera site/dist para deploy estatico.
      - name: state-yml:check
        command: npm run build && node dist/cli/bin.js state-yml-check
        category: governance
        mutates: true
        consumers: [script]
        description: Valida state.yml operacionais e tocados no diff local.
      - name: state-yml:check:all
        command: npm run build && node dist/cli/bin.js state-yml-check --all
        category: governance
        mutates: true
        consumers: [script, workflow]
        description: Varredura historica/global de todos os state.yml.
      - name: active-specs:check
        command: npm run build && node dist/cli/bin.js active-specs-check
        category: governance
        mutates: true
        consumers: [script]
        description: Verifica coerencia da projection specs/active.yml.
      - name: reconcile:check
        command: npm run build && node dist/cli/bin.js reconcile-check
        category: governance
        mutates: true
        consumers: [script]
        description: Advisory de continuidade operacional/canonical-next.
      - name: research-index:check
        command: npm run build && node dist/cli/bin.js research-index-check
        category: governance
        mutates: true
        consumers: [script]
        description: Falha se research consolidada em research-library/ nao estiver indexada no research-index.md, ou se um link do indice apontar para arquivo inexistente.
      - name: artifact-kind:check
        command: npm run build && node dist/cli/bin.js artifact-kind-check
        category: governance
        mutates: true
        consumers: [script]
        description: Brando; falha so se um artefato research/-class declarar artifact-kind fora do conjunto fechado (artifact-taxonomy.yml). Cobertura advisory, nao bloqueia legados nao marcados.
      - name: handoff:check
        command: npm run build && node dist/cli/bin.js handoff-check
        category: governance
        mutates: true
        consumers: [script]
        description: Advisory de freshness da retomada derivada (fontes + selo + proxima acao).
      - name: drift:check
        command: npm run build && node dist/cli/main.js drift --check
        category: governance
        mutates: false
        consumers: [script, hook, workflow]
        description: Preflight bloqueante de drift de governanca; read-only e derivado do Governance Doctor.
      - name: co-knowledge:check
        command: npm run build && node dist/cli/bin.js co-knowledge-check
        category: governance
        mutates: true
        consumers: [script]
        description: Advisory de Falsification/Knowledge.
      - name: co-knowledge:inventory
        command: npm run build && node dist/cli/bin.js co-knowledge-inventory
        category: governance
        mutates: true
        consumers: [script]
        description: Check required do inventario minimo de conhecimento.
      - name: constraints:check
        command: npm run build && node dist/cli/bin.js constraints-check
        category: governance
        mutates: true
        consumers: [script]
        description: CO-3.1; compila constraints (schema/paridade/superficies/mecanismos) em memoria.
      - name: knowledge:compile
        command: npm run build && node dist/cli/bin.js knowledge-compile compile
        category: build
        mutates: true
        consumers: [human]
        description: CO-3.2; persiste o manifesto runtime de constraints e orquestra build:rules (guarda-chuva).
      - name: knowledge:check
        command: npm run build && node dist/cli/bin.js knowledge-compile check
        category: governance
        mutates: true
        consumers: [script]
        description: CO-3.2; paridade derivada do manifesto persistido (existencia/classe/sync).
      - name: script-contracts:sync
        command: npm run build && node dist/cli/bin.js script-contracts sync
        category: governance
        mutates: true
        consumers: [human, hook]
        description: Sincroniza package.json, hooks, templates e docs a partir do contrato.
      - name: script-contracts:check
        command: npm run build && node dist/cli/bin.js script-contracts check
        category: governance
        mutates: false
        consumers: [script]
        description: Falha se scripts, hooks, templates ou docs divergirem do contrato.
      - name: runtime-bootstrap:sync
        command: npm run build && node dist/cli/bin.js runtime-bootstrap sync
        category: governance
        mutates: true
        consumers: [human, hook]
        description: Sincroniza o stub runtime do AGENTS.md.
      - name: runtime-bootstrap:check
        command: npm run build && node dist/cli/bin.js runtime-bootstrap check
        category: governance
        mutates: false
        consumers: [script]
        description: Falha se AGENTS.md divergir do stub runtime governado.
      - name: gate-decidability:check
        command: npm run build && node dist/cli/bin.js gate-decidability-check
        category: governance
        mutates: false
        consumers: [script]
        description: GG-0001; DECs nao-resolvidos precisam ser decidiveis.
      - name: ruleset:check
        command: npm run build && node dist/cli/bin.js ruleset-check
        category: governance
        mutates: true
        consumers: [script, workflow]
        description: Producibilidade dos required contexts; --parity para ruleset vivo.
      - name: review:check
        command: npm run build && node dist/cli/bin.js review-check
        category: governance
        mutates: true
        consumers: [script]
        description: Verifica artefatos de review/gate e fingerprints.
      - name: insights:check
        command: npm run build && node dist/cli/bin.js insights-check
        category: governance
        mutates: true
        consumers: [script]
        description: Valida ledger de insights.
      - name: intent:check
        command: npm run build && node dist/cli/bin.js intent-check
        category: governance
        mutates: true
        consumers: [script]
        description: Verifica intencao/governanca de PR.
      - name: disclosure
        command: npm run build && node dist/cli/bin.js disclosure-render
        category: governance
        mutates: true
        consumers: [human]
        description: Renderiza disclosure de IA derivado.
      - name: review:publish
        command: npm run build && node dist/cli/bin.js review-publish
        category: governance
        mutates: true
        consumers: [human]
        description: Commit exclusivo + push do artefato de review sob autorizacao capability-scoped (fail-closed; diff review-only).
      - name: review:seal
        command: npm run build && node dist/cli/bin.js review-seal
        category: governance
        mutates: true
        consumers: [human]
        description: Sela fingerprints de reviews E eventos (findings/review_fingerprint/event_fingerprint) por deteccao automatica do tipo.
      - name: pr-body:update
        command: npm run build && node dist/cli/bin.js pr-body-update
        category: governance
        mutates: true
        consumers: [human]
        description: Atualiza PR body preservando secoes baseline (FU-1); fallback gh api PATCH.
      - name: pr-body:create
        command: npm run build && node dist/cli/bin.js pr-body-create
        category: governance
        mutates: true
        consumers: [human]
        description: Cria PR body inicial a partir do perfil/template governado; open-next-topology-node delega para esta fabrica.
      - name: pr-body:check
        command: npm run build && node dist/cli/bin.js pr-body-check
        category: governance
        mutates: true
        consumers: [human]
        description: Confirma que o body remoto do PR esta sincronizado com o arquivo versionado na spec.
      - name: pr-body:publish
        command: npm run build && node dist/cli/bin.js pr-body-publish
        category: governance
        mutates: true
        consumers: [human]
        description: Publica no GitHub o PR body versionado na spec e confirma por releitura.
      - name: pr-body:pull
        command: npm run build && node dist/cli/bin.js pr-body-pull
        category: governance
        mutates: true
        consumers: [human]
        description: Importa o body remoto do GitHub para o arquivo versionado da spec com preview e confirmacao explicita.
      - name: pr-ready:check
        command: npm run build && node dist/cli/bin.js pr-ready-check
        category: governance
        mutates: true
        consumers: [human]
        description: Valida precondicoes da conversao Draft->Ready (FU-2); read-only, nao converte.
      - name: validate:changed
        command: npm run build && node dist/cli/main.js validate changed
        category: aggregate
        mutates: true
        consumers: [hook, workflow, human]
        description: Validacao intermediaria orientada ao diff; usada no pre-push diario. Com --fix pode formatar somente arquivos alterados.
      - name: validate
        command: npm run format:check && npm run build:all && npm run script-contracts:check && npm run runtime-bootstrap:check && npm run test && npm run living-docs:check && npm run site:build && npm run state-yml:check && npm run active-specs:check && npm run reconcile:check && npm run research-index:check && npm run artifact-kind:check && npm run drift:check && npm run co-knowledge:check && npm run co-knowledge:inventory && npm run constraints:check && npm run knowledge:check && npm run gate-decidability:check && npm run ruleset:check && npm run review:check && npm run insights:check && npm run intent:check
        category: aggregate
        mutates: true
        consumers: [workflow, human]
        description: Gate completo para Ready, Human Gate, fechamentos e CI completo; nao roda no pre-push diario.
      - name: ci
        command: npm ci && npm run validate && npm run state-yml:check:all
        category: aggregate
        mutates: true
        consumers: [workflow, human]
        description: Pipeline completo replicavel fora do GitHub; smoke real bloqueia Ready no fechamento final da spec, em diff nao classificavel, e antes de release/npm publish.
      - name: prepare
        command: husky
        category: lifecycle
        mutates: true
        consumers: [lifecycle]
        description: Instala hooks Husky.
      - name: prepack
        command: npm run build:all
        category: lifecycle
        mutates: true
        consumers: [lifecycle]
        description: Garante dist/ e rules.json antes de empacotar.

    hooks:
      pre-commit:
        steps:
          - run: lint-staged
          - run: script-contracts:sync
          - run: build:all
          - run: runtime-bootstrap:sync
          - git_add:
              - package.json
              - docs/scripts.md
              - .husky/pre-commit
              - .husky/pre-push
              - .core/templates/package.json.fragment.json
              - .core/templates/.husky/pre-commit.tmpl
              - .core/templates/.husky/pre-push.tmpl
              - .core/templates/.github/workflows/ai-guidelines-ci.yml.tmpl
              - .core/rules/_meta/rules.json
              - .core/rules/_meta/agents-core-ledger.md
              - .core/rules/catalog.md
              - AGENTS.md
          - run: test:unit
      pre-push:
        steps:
          - run: validate:changed

    workflows:
      - file: .github/workflows/repo-validation.yml
        required_runs:
          - npm run validate:changed
          - npm run validate
          - npm run state-yml:check:all
      - file: .github/workflows/release.yml
        required_runs:
          - npm run ci
          - npm run test:smoke
      - file: .github/workflows/smoke-multi-os.yml
        required_runs:
          - echo "Smoke tests are governed by pr-ready:check."
      - file: .github/workflows/ruleset-drift.yml
        required_runs:
          - npm run build && node dist/cli/bin.js ruleset-check --parity --live /tmp/live-ruleset.json

    docs:
      generated_file: docs/scripts.md
      rule_sources:
        - AGENTS.md
        - .core/rules/top/agents-core.md
        - CONTRIBUTING.md
      forbidden_phrases:
        - yarn format ; yarn validate ; git add . ; git commit
        - npm run format ; npm run validate ; git add . ; git commit

    hook_bootstrap:
      node_path: nvm

  consumer:
    package_scripts:
      - name: format
        command: prettier --write .
        description: Formata arquivos do consumidor.
      - name: check
        command: prettier --check .
        description: Check minimo de consumidor.
      - name: prepare
        command: husky
        description: Instala hooks Husky no consumidor.
    dev_dependencies:
      husky: ^9.1.7
      prettier: ^3.0.0
    hooks:
      pre-commit: "{{package_manager_runner}} {{format_command}}"
      pre-push: "{{package_manager_runner}} {{check_command}}"
    workflow:
      name: "{{ci_workflow_name}}"
      node_version: "{{node_version}}"
      install_command: "{{install_command}}"
      check_command: "{{check_command}}"
