name: Smoke Tests (multi-OS over tarball)

on:
  # PRs against any base branch (catches stacked PRs that target feature
  # branches rather than main — required by Spec 0023 lifecycle model).
  pull_request:
  push:
    branches:
      - main

jobs:
  # Agregador estável (Spec 0024 Checkpoint 2.2): expõe UM context fixo `smoke`
  # como required check do ruleset, em vez dos 6 nomes expandidos pela matriz
  # (`smoke / ubuntu-latest / node 24.x` …). Required contexts acoplados à matriz
  # são o vetor de drift que este checkpoint elimina (cf. .github/rulesets/README.md).
  #
  # Suspensão governada em nós intermediários (Spec 0024 / co-flow-convergence):
  # o contexto required `smoke` continua produzível para evitar drift do ruleset,
  # mas a suíte smoke real não roda em PRs intermediários sem impacto de pacote.
  # `pr-ready:check` decide, a partir da topologia e do diff do PR, quando smoke
  # real volta a ser obrigatório: último nó antes da integração final ou mudança
  # em pacote/runtime consumidor.
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    env:
      AI_GUIDELINES_SMOKE_TEMPORARILY_SUSPENDED: "true"
    steps:
      - name: Record governed smoke suspension
        run: |
          echo "Smoke tests are governed by pr-ready:check."
          echo "Real smoke is required for package/runtime changes and before final integration."
