name: Smoke Tests (multi-OS over tarball)

on:
  # PRs against any base branch (catches stacked PRs that target feature
  # branches rather than main — required by Spec 0023 lifecycle model).
  pull_request:
  push:
    branches:
      - main

jobs:
  # Agregador estável (Spec 0024 Checkpoint 2.2): expõe UM context fixo `smoke`
  # como required check do ruleset, em vez dos 6 nomes expandidos pela matriz
  # (`smoke / ubuntu-latest / node 24.x` …). Required contexts acoplados à matriz
  # são o vetor de drift que este checkpoint elimina (cf. .github/rulesets/README.md).
  #
  # Suspensão temporária governada (Spec 0024 / co-flow-convergence):
  # durante CO-10.2/CO-10.3, o contexto required `smoke` continua produzível para
  # evitar drift do ruleset, mas a suíte smoke real não roda. `pr-ready:check`
  # falha enquanto AI_GUIDELINES_SMOKE_TEMPORARILY_SUSPENDED=true, bloqueando
  # Ready/Human Gate até a reativação explícita antes do fechamento do nó.
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    env:
      AI_GUIDELINES_SMOKE_TEMPORARILY_SUSPENDED: "true"
    steps:
      - name: Record governed smoke suspension
        run: |
          echo "Smoke tests temporarily suspended for Spec 0024 CO-10.2/CO-10.3."
          echo "Ready/Human Gate remain blocked by pr-ready:check while AI_GUIDELINES_SMOKE_TEMPORARILY_SUSPENDED=true."
