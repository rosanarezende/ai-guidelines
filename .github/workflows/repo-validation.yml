name: Repo Validation

# Absorve o que era ai-guidelines-ci.yml + content-guardrails.yml em
# um workflow único, eliminando duplicação (ai-guidelines-ci rodava
# `yarn check` que já é subset de `yarn check:repo` rodado aqui).
# Living docs drift guard preservado como step próprio.

on:
  # PRs against any base branch (catches stacked PRs that target feature
  # branches rather than main — required by Spec 0023 lifecycle model).
  pull_request:
  push:
    branches:
      - main

jobs:
  repo-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies (immutable)
        run: yarn install --immutable

      - name: Validate quality gates (Format + Build + Tests + Coverage)
        run: yarn check:repo

      - name: Validate Living Documentation drift guard
        run: yarn living-docs:check
