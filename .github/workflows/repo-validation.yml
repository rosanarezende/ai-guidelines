name: Repo Validation

# Absorve o que era ai-guidelines-ci.yml + content-guardrails.yml em
# um workflow único, eliminando duplicação. Usa `npm run validate` como
# entry-point operacional (format:check + build:all + test + living-docs:check)
# e adiciona a varredura histórica de state.yml. `npm run ci` adicionaria smoke
# tests, mas smoke tem workflow próprio (smoke-multi-os.yml).

on:
  # PRs against any base branch (catches stacked PRs that target feature
  # branches rather than main — required by Spec 0023 lifecycle model).
  pull_request:
  push:
    branches:
      - main

jobs:
  repo-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Validate quality gates (Format + Build + Tests + Living Docs)
        run: npm run validate

      - name: Validate historical state.yml files
        run: npm run state-yml:check:all
