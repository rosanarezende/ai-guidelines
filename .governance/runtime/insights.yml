        cursor: checkpoint-cli-cutover
        note: "Falsificado o 'enum único de estados': o que recorre é o MECANISMO (afirmação→evidência→validação→compromisso), não os estados. KnowledgeStage já o codifica; as outras ladders rimam sem nome. Material preservado em research/2026-06-04-epistemic-commitment-model.md"
  - id: PIT-0008
    text: "Restrição de EVENTO (aterrissagem/merge) não deve ser enforçada em superfície de ESTADO CONTÍNUO (CI/status check/label/Draft-Ready/campo persistido): força inferir o evento → CI fica vermelha cedo demais ou verde tarde demais. Enforcement de evento vive em superfície de evento/operação; topology é declaração, não enforcement"
    status: open
    captured_at: 2026-06-06T03:53:25.306Z
    occurrences:
