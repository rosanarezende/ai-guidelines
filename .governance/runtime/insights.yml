  - id: PIT-0009
    text: "Projeção/affordance ≠ entidade/capability de 1ª classe. Modo de falha recorrente da 0023/0024: reificar o que é derivável (de topology/port/consolidate/Command existente) como estado-persistido/capability nova → drift + cópia paralela + sync manual. Critério decisivo (research 2026-05-30-projection-vs-entity-lens.md): se colapsar na entidade-mãe NÃO remove drift/cópia/sync-manual, é só renomear — não reificar."
