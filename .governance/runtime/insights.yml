    text: "Vários subsistemas (topology, PR lifecycle, gates, WorkflowStage, KnowledgeStage, disclosure) não são independentes — parecem instanciações de UM princípio gerador: compromisso epistêmico monotônico gateado por evidência (não afirmar além do que a evidência sustenta)"
