  - id: PIT-0011
    text: "Contrato executavel invisivel ainda produz ritual manual: existir template/comando/checker/hook nao basta se o agente nao descobre o contrato no momento da acao — descobribilidade situada e parte do contrato, nao acessorio"
    status: promoted
