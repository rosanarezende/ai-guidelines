  - id: PIT-0008
    text: "Restrição de EVENTO (aterrissagem/merge) não deve ser enforçada em superfície de ESTADO CONTÍNUO (CI/status check/label/Draft-Ready/campo persistido): força inferir o evento → CI fica vermelha cedo demais ou verde tarde demais. Enforcement de evento vive em superfície de evento/operação; topology é declaração, não enforcement"
