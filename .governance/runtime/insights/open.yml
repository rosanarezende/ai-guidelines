  - id: PIT-0013
    text: Uma decisao reservada ao humano continua sendo procedimento tecnico quando o sistema nao traduz contexto, riscos, evidencias e consequencias antes de pedir a escolha — autoridade reservada exige briefing humano-primeiro (o que/por que/o que estava errado/o que foi feito/como foi verificado/riscos/consequencias/o que NAO autoriza) e prévia+confirmacao, nao apenas reservar a permissao
