# intent-0001 — cadastrada via "form" de governança (Lente 5). A intent é uma REGISTRY:
# guarda o que o cadastrante informa + REFERÊNCIAS; o conteúdo das investigações vive nas explorations (repos).
node: intent
id: intent-0001
status: active
created-at: 2026-06-27

# ===== o que o CADASTRANTE preenche no form =====
title: Sistema de login (multi-repo)
objective:
  goal: novo fluxo de login, com ajuda sob demanda e proativa
  success-signal: login navegável atrás de flag

references: # anexos / links que ele junta
  - {
      type: modeling,
      label: "modelagem do login (produto)",
      url: "https://docs.acme.example/login-modeling",
    }

details: |
  Feature cross-repo. As deliveries só nascem depois que as open-questions forem respondidas pelas explorations.

open-questions: # as incertezas do cadastro → cada uma DISPARA uma exploration
  - id: q1
    question: "o design system tem um formulário validado (email/site/telefone), ou cada MFE reimplementa?"
    # ↓ GERADO (A+) do `answers` da exploration — VISÍVEL aqui (as 2 pontas se referenciam), mas NÃO se edita à mão; um check garante que bate:
    answered-by: acme-design-system/exploration-001 # a exploration que responde q1
    status: resolved # GERADO: exploration fechou + decisão d1 ACEITA → resolveu
    verdict: "não — o DS não tem form validado; cada MFE reimplementa hoje → precisa criar o componente" # GERADO: espelha o verdict do exploration-answer
  - id: q2
    question: "suporte proativo é viável? (detectar N falhas de login por pub/sub e abordar o usuário)"
    answered-by: acme-mfe-support/exploration-001 # GERADO (A+): a exploration DENSA (com POC) que responde q2
    status: answered # GERADO: a exploration fechou (verdict existe) MAS a decisão d2 está pending → NÃO resolveu (gate)
    verdict: "viável (pub/sub conta as falhas e dispara após N); SE proativo AJUDA é hipótese de produto → experiment dedicado" # GERADO

# ===== contratos que a feature coordena — UMA lista; o status known/pending é DERIVADO (sem baldes) =====
contracts:
  - { name: form-component, awaits: q1 } # pending até q1 resolver; aí known (DERIVADO) → destrava as deliveries do form
  - { name: failure-event, awaits: q2 } # contrato de evento (pub/sub login/step-failed); known quando q2 resolve

# breaks-into = VISTA derivada das work-registries (ambas explorations fecharam):
breaks-into:
  done: [acme-design-system/exploration-001, acme-mfe-support/exploration-001]
