# deliberation.yml — mapa VIVO da deliberação da intent-0001 (≈ state). Lista APPEND-ONLY de decisões (nós).
# Decidir = APPEND um nó (status accepted|rejected). "Pending" NÃO é nó — é o estado DERIVADO de uma question
#   respondida (tem verdict) e ainda SEM decisão. Reabrir uma decisão = nó NOVO + `supersedes` (nunca virar status).
# Aqui ficam os NÓS + ARESTAS (decides · supported-by · spawns · supersedes); o rationale é conteúdo (inline curto na sim).
decisions:
  - id: d1
    decides: q1
    status: accepted # o humano ACEITOU o verdict
    supported-by: acme-design-system/exploration-001 # a evidência (aresta Lente 3)
    rationale: "verdict claro: o DS não tem form validado → criar o componente"
    spawns: [acme-design-system/deliv-form-component]
    decided-at: 2026-06-27
  - id: d2
    decides: q2
    status: accepted # DECIDIDO (você aceitou): viável → cria a ajuda sob demanda
    supported-by: acme-mfe-support/exploration-001
    rationale: "viável; a ajuda sob demanda absorve a POC (o proativo A/B vira experiment dedicado, via proposal)"
    spawns: [acme-mfe-support/deliv-help-on-demand]
    decided-at: 2026-06-27
