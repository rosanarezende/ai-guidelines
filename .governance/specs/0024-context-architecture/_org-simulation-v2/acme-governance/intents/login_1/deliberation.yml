# deliberation.yml — mapa VIVO da deliberação da intent login_1 (≈ state). Lista APPEND-ONLY de decisões (nós).
# Decidir = APPEND um nó (status accepted|rejected). "Pending" NÃO é nó — é o estado DERIVADO de uma question
#   respondida (tem verdict) e ainda SEM decisão. Reabrir uma decisão = nó NOVO + `supersedes` (nunca virar status).
# Aqui ficam os NÓS + ARESTAS (decides · supported-by · results-in · supersedes); o rationale é conteúdo (inline curto na sim).
decisions:
  - id: d1
    decides: [q1] # uma decisão pode fechar VÁRIAS questions (lista)
    status: accepted # o humano ACEITOU o verdict
    supported-by: acme-design-system/exploration/form-validation_1 # a evidência (aresta Lente 3)
    rationale: "verdict claro: o DS não tem form validado → criar o componente"
    results-in: [
        acme-design-system/delivery/form-component_1,
        acme-mfe-identity/delivery/login-mfe_1,
      ] # q1 destrava form + login-mfe
    decided-at: 2026-06-27
  - id: d2
    decides: [q2]
    status: accepted # DECIDIDO (você aceitou): viável → cria a ajuda sob demanda
    supported-by: acme-mfe-support/exploration/proactive-support_1
    rationale: "viável; a ajuda sob demanda absorve a POC (o proativo A/B vira experiment dedicado, via proposal)"
    results-in: [acme-mfe-support/delivery/help-on-demand_1]
    decided-at: 2026-06-27
