<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Banco derivado — viewer</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #fff;
        --ink: #1c2430;
        --muted: #6b7684;
        --line: #e3e7ec;
        --ok: #1a7f4b;
        --ok-bg: #e6f4ec;
        --warn: #9a6700;
        --warn-bg: #fdf3da;
        --info: #1f5fb0;
        --info-bg: #e7f0fb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }
      .wrap {
        max-width: 880px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }
      header h1 {
        margin: 0 0 4px;
        font-size: 24px;
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
      }
      h2 {
        font-size: 16px;
        margin: 32px 0 12px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 6px;
      }
      h3 {
        font-size: 14px;
        margin: 18px 0 8px;
        color: var(--muted);
      }
      .hint {
        font-weight: 400;
        color: var(--muted);
        font-size: 12px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 10px;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .meta {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
      }
      .verdict {
        margin-top: 6px;
        font-size: 14px;
        color: #2b3440;
        background: #fafbfc;
        border-left: 3px solid var(--line);
        padding: 6px 10px;
        border-radius: 4px;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.92em;
        background: #eef1f4;
        padding: 1px 5px;
        border-radius: 4px;
      }
      .badge {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .badge.ok {
        color: var(--ok);
        background: var(--ok-bg);
      }
      .badge.warn {
        color: var(--warn);
        background: var(--warn-bg);
      }
      .badge.info {
        color: var(--info);
        background: var(--info-bg);
      }
      .badge.muted {
        color: var(--muted);
        background: #eef1f4;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .cols {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .col {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
      }
      .col-head {
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .item {
        font-size: 13px;
        font-family: ui-monospace, monospace;
        padding: 4px 0;
      }
      .item.muted {
        color: var(--muted);
        font-family: inherit;
      }
      .err {
        background: var(--warn-bg);
        color: var(--warn);
        padding: 16px;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="wrap"><div id="root"></div></div>

    <!-- o dado DERIVADO (GERADO pelo banco) — abre via file:// sem servidor -->
    <script src="../_banks/_out/snapshot.js"></script>
    <script type="module">
      import React from "https://esm.sh/react@19";
      import { createRoot } from "https://esm.sh/react-dom@19/client";
      import htm from "https://esm.sh/htm";

      const html = htm.bind(React.createElement);
      const snap = window.__SNAPSHOT__;

      const Badge = ({ kind, children }) => html`<span class="badge ${kind}">${children}</span>`;

      function Question({ q }) {
        const [kind, label] = q.resolved
          ? ["ok", "RESOLVED"]
          : q.answered
            ? ["warn", `respondida · decisão ${q.decision}`]
            : ["muted", "open"];
        return html`
          <div class="card">
            <div class="card-head"><strong>${q.id}</strong><${Badge} kind=${kind}>${label}<//></div>
            ${q.answeredBy && html`<div class="meta">← <code>${q.answeredBy}</code></div>`}
            ${q.verdict && html`<div class="verdict">${q.verdict}</div>`}
          </div>
        `;
      }

      function Work({ w }) {
        return html`
          <div class="card">
            <div class="card-head">
              <strong>${w.ref}</strong>
              <${Badge} kind=${w.status === "done" ? "ok" : "muted"}>${w.status}<//>
              ${w.fate && html`<${Badge} kind="info">fate ${w.fate}<//>`}
            </div>
            ${w.verdict && html`<div class="verdict">${w.verdict}</div>`}
            ${w.promotedOutput &&
            html`<div class="meta">promovido → <code>${w.promotedOutput}</code></div>`}
          </div>
        `;
      }

      function App() {
        if (!snap)
          return html`<p class="err">
            Sem snapshot. Rode <code>node _banks/run.ts</code> e recarregue.
          </p>`;
        const g = snap.governance;
        return html`
          <header>
            <h1>${g.title}</h1>
            <div class="sub">
              intent <code>${g.intent}</code> · projeção DERIVADA do banco · não editar
            </div>
          </header>

          <section>
            <h2>Perguntas <span class="hint">(respondida ≠ resolvida — o gate humano)</span></h2>
            ${g.questions.map((q) => html`<${Question} key=${q.id} q=${q} />`)}
          </section>

          <section>
            <h2>Contratos</h2>
            <div class="chips">
              ${g.contracts.map(
                (c) =>
                  html`<${Badge} key=${c.name} kind=${c.known ? "ok" : "warn"}>
                    ${c.name}:
                    ${c.known ? "known" : "pending"}${c.awaits ? ` (awaits ${c.awaits})` : ""}
                  <//>`
              )}
            </div>
          </section>

          <section>
            <h2>Plano <span class="hint">(breaks-into — derivado dos works)</span></h2>
            <div class="cols">
              ${["done", "active", "draft"].map(
                (s) =>
                  html`<div class="col" key=${s}>
                    <div class="col-head">${s}</div>
                    ${(g.breaksInto[s] || []).length
                      ? g.breaksInto[s].map((r) => html`<div class="item" key=${r}>${r}</div>`)
                      : html`<div class="item muted">—</div>`}
                  </div>`
              )}
            </div>
          </section>

          <section>
            <h2>Bancos de repo <span class="hint">(cada um deriva só os arquivos dele)</span></h2>
            ${snap.repos.map(
              (repo) =>
                html`<div key=${repo.repo}>
                  <h3>${repo.repo}</h3>
                  ${repo.explorations.map((w) => html`<${Work} key=${w.ref} w=${w} />`)}
                </div>`
            )}
          </section>
        `;
      }

      createRoot(document.getElementById("root")).render(html`<${App} />`);
    </script>
  </body>
</html>
