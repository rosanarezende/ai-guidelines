node: intent
sealed: false
created-at: 2026-06-26

id: intent-004
title: Sistema de login (multi-repo)
status: active

objective:
  goal: novo fluxo de login, com ajuda/suporte sob demanda e proativa (aborda quem falha repetidas vezes)
  success-signal: login navegável atrás de flag + os 2 spikes respondidos antes de quebrar as deliveries
  out-of-scope: as deliveries só nascem após a retroalimentação dos spikes

references:
  - type: modeling
    label: "modelagem do login (produto)"
    url: "https://docs.acme.example/login-modeling"
    note: "fluxo + critérios de validação do formulário"
  - type: design
    label: "protótipo do login"
    url: "https://design.acme.example/login"
    note: "estados de erro que disparam o suporte proativo"

target-repos:
  - acme-api
  - acme-design-system
  - acme-mfe-identity
  - acme-mfe-support
  - acme-shell

open-questions:
  - id: q1
    question: "o design system tem um formulário dedicado com validação (email/site/telefone), ou cada MFE reimplementa?"
    spike: acme-design-system/spike-301
    verdict-inline: "não — o DS não tem form validado; cada MFE reimplementa hoje → precisa criar o componente"
    unlocks: # q1 RESPONDIDA (spike-301 done) → destrava
      - acme-design-system/deliv-210 # criar o componente de form validado
      - acme-mfe-identity/deliv-220 # login MFE (consome o form)
  - id: q2
    question: "suporte proativo é viável? (detectar N falhas de login pelo canal de comunicação e abordar o usuário)"
    spike: acme-mfe-support/spike-302
    verdict-inline: "viável (pub/sub conta as falhas e dispara após N); SE proativo ajuda é hipótese de produto → experiment dedicado"
    unlocks: # q2 RESPONDIDA (spike-302 done) → destrava
      - acme-mfe-support/deliv-230 # ajuda sob demanda (absorve a POC do listener)
      # proativo A/B = experiment futuro, em intent dedicada (não entra aqui)

contracts:
  known:
    - "auth endpoints (schema de sessão/token) — acme-api"
    - "componente de formulário validado — acme-design-system (resolvido por q1/spike-301)"
    - "evento de comunicação MFE↔MFE p/ suporte proativo (canal `login`:`step-failed`, payload {field,attempts}) — acme-mfe-identity ↔ acme-mfe-support (resolvido por q2/spike-302)"
  pending-spike: [] # todos os spikes respondidos → pronto pra quebrar as deliveries

breaks-into:
  - acme-design-system/spike-301
  - acme-mfe-support/spike-302
