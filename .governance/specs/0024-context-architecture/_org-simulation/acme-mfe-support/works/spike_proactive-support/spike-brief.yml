node: work-brief
kind: spike
id: spike-302
intent: intent-004
timebox: 3d
references: []

objective:
  goal: o suporte proativo é viável (detectar N falhas de login pelo canal de comunicação e abordar)?
  approach: POC de um listener de `login:step-failed` que conta falhas por sessão e dispara após N
  success-signal: prova de que o canal pub/sub conta as falhas e dispara o handler

unblocks-decision: se o suporte proativo entra como delivery ou vira experiment (decisão de produto)
output: a RESPOSTA + a POC do listener → fecha em spike-answer

details: |
  Hipótese técnica: o login MFE emite `login:step-failed` a cada falha; o support escuta, mantém um
  contador por sessão e dispara o suporte ao atingir N.
