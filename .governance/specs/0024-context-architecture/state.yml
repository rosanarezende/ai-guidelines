gate:
  status: closed
focus:
  - "RECONCILIACAO 2026-06-03 ([DEC-0024-G08], owner): G03 (promotion pipeline) / G04 (casa unica/tri-root) / G05 (projecoes) foram REABERTOS. Os eixos deixados em aberto no Stage 1 mostraram-se necessarios para problemas reais observados no uso (mis-binding da retomada, recuperabilidade, 'a resposta estava num ADR esquecido'). A 0024 VOLTOU A TRATAR MODELAGEM nesses eixos -- isto e DECISAO, nao drift. Direcao assumida: arquitetura orientada a grafo (entidades + relacoes navegaveis KnowledgeRef + projecoes derivadas). NAO ha 0025 independente (o split foi superado no Checkpoint 2; o trabalho mapeia em G03/G04/G05 + candidatas Grupo B). O kernel Knowledge + KnowledgeGraph nucleo + capability Insights JA materializados (PR #34). Motivacao persistida como Insights (PIT-0004..0006)."
  - "0024 em ABSORCAO OPERACIONAL (pesquisa encerrada). Problema = falta de absorcao, nao falta de decisao: decisoes convergidas ainda nao alteraram o comportamento do sistema ('arquitetura converge enquanto codigo diverge'). Backlog = relatorio de auditoria do Codex (divergencias decisao<->codigo)."
  - "Plano executavel CANONICO no repo: plan.md secoes 'Sequencia de Checkpoints' + 'Topologia operacional'. VOCABULARIO (Checkpoint 2.1): PR/#N = Pull Request real do GitHub; Checkpoint N = unidade de implementacao da spec; Gate = ritual de validacao (Technical Audit -> Architectural Review -> Human)."
  - "TOPOLOGIA CANONICA (corrigida no Checkpoint 2.1a; modelo da 0023 / ADR 0020 + 0024 / DEC-0023-M01): #32 = PR de governanca/bootstrap + LINHA DE INTEGRACAO da spec; NAO mergeia cedo, e a BASE DA STACK. Checkpoint 3+ = PR real proprio STACKED sobre a linha da spec (NAO off-main, NAO independente). Modo UNIT: merge em main e evento UNICO ao fim (veiculo = PR terminal de implementacao; #32 + intermediarios + Integration PR via landed-via reconciliation; 1 SHA canonico), apos review.md R8. Integration PR = homologacao antes do merge (NAO veiculo)."
  - "Decisoes cravadas (NAO reabrir): G00/G02/G06; Open abolido/DEC nasce Pendente/Deferred canonico; brief por estado; GG-0001 interno (DOGFOOD-*); WorkflowType removido; proveniencia runtime-scoped (role livre, espinha impl+gate derivada, projecao NAO governanca); GG-0002 antes da remocao."
  - "Gate por checkpoint: Claude implementa -> Technical Audit Gate (Codex) -> Architectural Review Gate (ChatGPT) -> Human Gate (owner) -> AVANCA (abre o proximo PR stacked). O Human Gate decide o PROXIMO MOVIMENTO, NAO mergeia em main. 1 checkpoint atomico por vez; parar no Gate quando o commit estiver pronto. Correcao local pequena nao espera; mudanca estrutural sim."
  - "Criterio (RESSALVADO em 2026-06-03 por [DEC-0024-G08]): 'ja foi validado empiricamente na 0024?' -> absorver/enforcar/executar. NAO re-modelar o DECIDIDO (G00/G02/G06/G07 seguem cravados). EXCECAO assumida: G03/G04/G05 foram reabertos para modelagem deliberada (orientada a grafo) -- nesses eixos, modelar e a direcao, nao o risco. O 'risco dominante' original (modelar em vez de absorver) vale para os eixos resolvidos; nos reabertos, a modelagem e o trabalho."
next:
  - "#32 GATED: Checkpoints 2 (8b0eec6) + 2.1 (d686d4b) + 2.1a (fa2c0ae) fechados. #32 permanece como linha de integracao -- NAO mergeia."
  - "#33 (branch feat/spec-0024-ruleset-producibility) = unico PR de execucao stacked aberto (sequence 1); embarca os Checkpoints 2.2, 2.2b, 2.3, 2.3a, 2.3b, 2.4, 2.4a, 2.4b, 2.4c e 2.4d. NAO existe branch feat/spec-0024-topology (corrigido no 2.3a: o no-fantasma checkpoint-2.3 foi dobrado em #33)."
  - "Checkpoint 2.3a + 2.3b implementados: 2.3a reconcilia topologia<->realidade (B1), registra [DEC-0024-G07] (B2), elimina dual-SSOT do plan.md (O1), invariantes de sequence (O6), robustez do governance-pr-check (O2). 2.3b adiciona o guard LOCAL de lifecycle-coerencia (github_pr <=> active/concluded + unicidade) e REAVALIA O5: well-formedness e guard local (no state-yml:check/repo-validation, ja required), nao debito de API -> promocao do governance-pr-check a REQUIRED recomendada. So a paridade-API resta como hardening futuro nao-bloqueante (NEXT separado)."
  - "RULESET VIVO ATUALIZADO (2026-06-01, autorizado): required_status_checks = repo-validation + smoke + governance-pr-check (apply consolidado; o smoke do 2.2 nunca fora aplicado -> aterrissado agora). Paridade vivo<->versionado VERDE (.github/rulesets/main-governance.json = SSOT). governance-pr-check agora bloqueia merge."
  - "Checkpoint 2.4 (revisao-como-artefato MVP) + 2.4a (endurecimento) + 2.4b (fecha bypass da poda final): reviews/gates = ARTEFATOS versionados; consolidado DERIVADO por `review:check` (no validate). 2.4a: FINDING reviewer-owned (disposition destrava o gate) vs RESOLUCAO implementer-owned (NAO destrava) = anti-autoaprovacao; findings_emitted+ids contiguos = anti-delecao-do-meio; location obrigatoria; fingerprint sela a claim. 2.4b: review_fingerprint (envelope) fecha a PODA FINAL; checkpoint+role no per-finding hash fecha TRANSPLANTE. 2.4c (bugs da auditoria final): fingerprint via JSON.stringify (canonico, fim da ambiguidade de \\n); resolucao aponta finding totalmente qualificado <role>#<id> com match exato (fim do endsWith que colidia cross-role). Limite honesto: tamper-EVIDENCE (forja visivel), nao prevencao (ADR 0021). Dogfood: c2.3-arch.yml + c2.3-resolutions.yml."
  - "Checkpoint 2.4d (disclosure de IA = projecao de PROCESSO derivada): renderer puro `disclosureRender` (`yarn disclosure`) deriva de consolidate() ∩ checkpoints do PR na topologia -- nº revisoes, categorias, findings emitidos/resolvidos, gate. ZERO artefato/schema novo. REJEITADOS (nao reabrir): Co-Authored-By/git trailers como fonte (autoria != participacao) e participants.yml/contributors.yml/ledger (over-modeling, actor->role nasce falso m:n). Frase 'Implementacao assistida por IA' = editorial do template, nao dado governado. Falsificacao fechou A (cobertura de escopo: approved exige cobertura total, senao partial) + C (violations do consolidate fatais no main); B (disclosure stale, sem detector de drift) DEFERIDO (NEXT.md, disclosure:check)."
  - "Gate do #33 FECHADO: gates/c2.4d.yml approved (PR INTEIRO, keyado no cursor 2.4d, NAO retroativo por checkpoint) + reviews/c2.4d-architectural_review.yml (F1/F2 accepted, F3 dismissed-deferido) + resolutions; review:check verde; CI clean; Human Gate ratificado (owner APPROVED 2026-06-02). PROXIMO: abrir o Checkpoint 3 (GG-0003 Consistency Projection Check, sequence 2) stacked, nascendo com review-as-artifact + disclosure derivado (sem texto manual). PRIMEIRO passo do 3: alinhar com owner a LISTA FIXA de marcadores (decisao de design; nao cravar sozinho). Ao abrir: #33 -> concluded, checkpoint-3 -> active com github_pr."
  - "Encerramento: instanciar review.md (gates R1-R7) -> abrir Integration PR (homologacao) -> commit de encerramento (spec->Done, state->done, NEXT deletado, release-log T0) -> review.md R8 -> MERGE UNICO em main (modo unit). spec->Done so no fim."
  - "LER antes de qualquer acao: research/2026-06-02-handoff-checkpoint-3.md (SSOT da retomada para o Checkpoint 3; supersede o handoff-next-session) + state.yml § topology + plan.md. Verificar git limpo + yarn validate verde + gate do #33 (gates/c2.4d.yml) approved."
