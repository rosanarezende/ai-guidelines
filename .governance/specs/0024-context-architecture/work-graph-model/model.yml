# model.yml — SSOT DA MODELAGEM (o grafo tipado do trabalho). v2 — 3 camadas + tier de negócio.
#
# FONTE DA VERDADE do modelo. O `tracker.md` é EMBASAMENTO (o porquê). O artefato navegável
# (_map/model-map.html) reflete este arquivo. As provocações entram como mudanças aqui.
#
# Estrutura: intent (estratégia) → execution-unit (tipo, cross-repo) → repo-work (propósito, por repo)
#   + contract (coordenação/versionamento) + q/r/d (anexável a qualquer nó) + intake (funil pré-intent).
# Perspectiva do Codex reconciliada (substitui a taxonomia "famílias" v0). Ainda ITERANDO (open-questions).
# Anonimizado (acme-*). Naming (P4): ids em EN, labels/descrição em PT.

meta:
  version: 2
  status: iterating # 3 camadas + business-tier + scaling-law APLICADOS (gate owner 2026-07-01); P10 em curso
  grounded-by: tracker.md
  artifact: _map/model-map.html # navegável; data.js é GERADO por _map/generate.mjs (node generate.mjs · --check verifica o sync do SUBCONJUNTO projetado — coverage impressa a cada run; --check FORA do validate por decisão da owner 2026-07-01)

# ═════════════════════ AS 3 CAMADAS ═════════════════════
layers:
  intent:
    is: "o objetivo de negócio durável (uma por objetivo); NÃO delibera — tem gate de ativação"
    owns: [enquadramento, objetivo, target-outcome, decision-gate]
    strategy: [experiment-led, direct-delivery, migration-led, reliability-led]
    strategy-note: "RESOLVIDO (Q-strategy, owner 2026-07-01): DECLARADA pelo humano no gate de ativação — a estratégia é a APOSTA de quem ativa (existe antes das units e molda breakdown/gates). A derivada vira CONFERÊNCIA: observed-strategy das units divergindo da declarada → alerta strategy-drift no dashboard (não bloqueia; é conversa). Autoria com IA: ver assisted-authoring"
    breaks-into: [execution-unit, repo-work] # repo-work direto quando trivial (intent pode até ser nula em trabalho reativo)

  execution-unit:
    is: "unidade CROSS-REPO com lifecycle próprio + unidade semântica (a coisa é UMA)"
    optional: "COLAPSA no trivial (regra exata: collapse-rule) — aí intent liga direto no repo-work"
    collapse-rule: "RESOLVIDO (Q-collapse, owner 2026-07-01) — a régua é a scaling-law: a unit EXISTE se pelo menos um vale: (1) mais de 1 repo envolvido · (2) o kind carrega lifecycle próprio (experiment-run/migration-wave/incident-response/rollout-slice NUNCA colapsam — veredito/janela/severidade/fases moram na unit) · (3) owner/cadência próprios ≠ intent. Senão COLAPSA. Colapso REVERSÍVEL: se o trabalho crescer (2º repo entra), cria-se a unit e as peças se reparentam — mutação normal com envelope, histórico preservado"
    kinds:
      experiment-run:
        owns: [hypothesis, flag, exposure, metrics, guardrails, decision-rule, verdict]
        verdict: [pending, won, lost, inconclusive]
        fork: "won → shape-up/feature-slice · lost → cleanup · inconclusive → novo experiment/exploration"
      migration-wave:
        owns: [from, to, compatibility-window]
      feature-slice:
        owns: ["entrega coordenada cross-repo"]
      incident-response:
        owns: [severity, declare, mitigate, resolve, postmortem]
        source: reactive
      shape-up:
        owns: ["sistematização pós-veredito won (vira capacidade permanente)"]
      cleanup:
        owns: ["remoção pós-veredito lost / parcial"]
      rollout-slice:
        owns: ["fase de release/canary"]
    breaks-into: [repo-work]

  repo-work:
    is: "a peça executável num repo"
    owns: [execução, status-próprio]
    purpose:
      create: "cria capacidade nova (shippa valor novo)"
      sustain: "preserva/adapta a existente (fix · dep-bump · refactor · porte from→to)"
      discover: "reduz incerteza — NÃO shippa (POC/spike; timebox + pergunta falsificável + fate)"
      operate: "rollout · monitoramento · instrumentação · baseline (novo — do playbook de growth)"

# ═════════════════════ NÓS DE APOIO (não são camadas) ═════════════════════
contract:
  is: "nó de coordenação/versionamento — DENTRO e ENTRE iniciativas"
  fields: [owner, provider, consumers, revision, compatibility-window, migrations]
  note: "coordenação entre iniciativas = via contrato compartilhado (derivada); a janela-de-compat NÃO é derivável — mora aqui"

deliberation:
  is: "q/r/d (question → research → decision) — ANEXÁVEL a qualquer nó, não uma camada"
  attaches-to: [intent, execution-unit, repo-work, contract]
  enforcement: "OPCIONAL por decisão da owner (coração do framework, sem obrigatoriedade). Mutação DANGEROUS (ver envelope.mutation-types.dangerous) dispara ALERTA: ou anexa q/r/d, ou registra justificativa append-only de por que não usou (auditável) — gate G11/P10. CAMADA F11 (decisão owner 2026-07-01, opção C): no perfil FULL, o subconjunto ruler-authority é SOFT-MANDATORY — exige um PAR (four-eyes) OU break-glass logado + revisão retroativa obrigatória; NÃO exige q/r/d (pede uma segunda pessoa, não um processo). compact = detecção + revisão retroativa em cadência · solo = detecção/self-log"

intake:
  is: "funil PRÉ-intent (register → triagem → gate) — fora das 3 camadas"
  members: [proposal, register]
  business-link: "G2 (bloco B): todo register/proposal DECLARA authorized-by (um business-objective ativo) OU standalone — vínculo declarado, nunca inferido. No gate: com authorized-by, valida-se objective ativo + target + allocation; standalone entra como custo/risco operacional (ver G14), não some do dashboard"

assisted-authoring:
  is: "parceria humano+IA na CRIAÇÃO/edição de nós governados (decisão owner 2026-07-01, nascida na Q-strategy): o humano descreve a pretensão — texto livre e/ou documentos anexados (ex.: docs de modelagem) — e a IA SUGERE o preenchimento dos campos (strategy · título · vínculos · esboço de breakdown); o humano itera e edita o que quiser"
  laws:
    - "OPCIONAL sempre — o caminho 100% manual existe em todo nó; a assistência nunca é pré-requisito"
    - "SUGESTIVO sempre — a IA não preenche em silêncio nem decide; sugere e o humano aceita/edita (reusa o princípio 'advisory, não decide' do matcher)"
    - "no MÁXIMO alerta — quando a proposta do humano se encaixa TOTALMENTE noutro espectro (ex.: strategy declarada direct-delivery mas a descrição é um experimento), a IA alerta; não corrige nem bloqueia"
  applies-to: "criação de intent (caso primário) e, pelo mesmo princípio, qualquer nó governado (proposal · register · objective)"
  connects: "matcher advisory (triagem) · strategy-drift (a conferência derivada em execução) · L9 (IA não fecha gate)"

# ═════════════════════ DIMENSÕES (ortogonais; cortam repo-work/execution-unit) ═════════════════════
dimensions:
  source: [planned, reactive]
  visibility: [user-visible, internal, operator-visible, security-visible]
  maintenance-mode: [corrective, adaptive, perfective, preventive] # só sustain (ISO 14764)
  change-class: [standard, normal, emergency] # ITIL
  service-class: [expedite, fixed-date, standard, intangible] # Kanban
enforcement: "cada dimensão precisa afetar workflow/lint/dashboard, senão é tag decorativa"
presets: # UX: expandem p/ purpose + dimensões
  fix: { purpose: sustain, maintenance-mode: corrective, visibility: user-visible }
  security-patch: { purpose: sustain, maintenance-mode: corrective, visibility: security-visible }
  dep-bump: { purpose: sustain, maintenance-mode: adaptive, visibility: internal }

# ═════════════════════ ARESTAS (o grafo; anota-se 1 lado, o reverso deriva) ═════════════════════
edges:
  - {
      id: breaks-into,
      from: intent,
      to: [execution-unit, repo-work],
      cardinality: "1:N",
      category: estrutura,
    }
  - { id: contains, from: execution-unit, to: repo-work, cardinality: "1:N", category: estrutura }
  - { id: coordinates-with, from: repo-work, to: contract, category: dependência }
  - { id: blocked-by, from: repo-work, to: repo-work, inverse: blocks, category: dependência }
  - {
      id: results-in,
      from: execution-unit,
      to: execution-unit,
      inverse: derives-from,
      category: proveniência,
      note: "won→shape-up · lost→cleanup",
    }
  - { id: raises, from: node, to: proposal, category: proveniência }
  - { id: answers, from: "repo-work(discover)", to: "question", category: investigação }
  - { id: supported-by, from: decision, to: "research|discover", category: investigação }
  - { id: closed-by, from: node, to: "answer|outcome|postmortem", category: fecho }
  - { id: supersedes, from: decision, to: decision, category: histórico }
  - { id: occurred-during, from: incident-response, to: node, category: resposta }
  - { id: caused-by, from: incident-response, to: node, category: resposta }

states:
  own: [draft, active, done] # active EXIGE assignee + início
  derived: [blocked, paused]
  business-tier: [proposed, active, closed, superseded, dropped] # G8 — lifecycle de objective/target sai da prosa e entra no catálogo

# ═════════════════════ ENVELOPE (L8) + CONFIANÇA (L9) — inalterados do tracker ═════════════════════
envelope:
  quem: [actor, authority]
  base: [base-revision, idempotency-key, revision]
  origem: [schema-version, source-commit, producer, ttl]
  seguranca: [classification, visibility, access]
  invalidacao: [invalidates]
  mutation-types: # G9 + F3 — toda mutação DECLARA o tipo; catálogo por tier, FECHADO (fail-closed)
    business-tier:
      [
        objective-create,
        objective-close,
        target-change,
        actual-publish,
        rollup-change,
        allocation-change,
        metric-definition-change,
        aggregation-change,
      ]
    work-tier: [intent-activate, unit-fork, verdict-set, verdict-override, work-state-change]
    intake: [business-link-change]
    coordination: [contract-revision, compat-window-change]
    governance: [profile-change, break-glass] # F3 — agora são TIPOS reais (a law dos perfis já exigia)
    dangerous: # F3 — lista ENUMERADA, não prosa; disparam o ALERTA q/r/d (deliberation.enforcement)
      [
        target-change,
        rollup-change,
        compat-window-change,
        verdict-override,
        break-glass,
        profile-change,
        metric-definition-change,
        aggregation-change,
        business-link-change,
      ]
    ruler-authority: # F11 (decisão owner 2026-07-01, opção C) — subconjunto de dangerous que muda a RÉGUA/AUTORIDADE; no perfil full é SOFT-MANDATORY
      [metric-definition-change, aggregation-change, profile-change, verdict-override, break-glass]
    unknown-mutation: "fail-closed (F3): mutação sem tipo do catálogo, ou cujo DIFF não bate com o tipo declarado (ex.: mudar a fórmula da métrica rotulada de actual-publish), é REJEITADA — não existe 'normal por default'"
trust:
  boundary: "entidade de 1ª classe (matcher/agente/backend/API são fronteiras)"
  policy-artifacts:
    [threat-model, egress-policy, agent-delegation-policy, policy-catalog, red-team-corpus]
  laws:
    - {
        id: fallback-break-glass,
        says: "todo controle que bloqueia precisa de saída segura e rastreável",
      }
    - {
        id: independencia,
        says: "enforça-se quem VERIFICA (SoD requester≠approver≠owner-attester), não a verdade de quem declara (X no fluxo + O1 no oráculo)",
      }
    - {
        id: dependencia-verificavel,
        says: "nenhuma ação derivada é aceita sem validar as revisões (dados/política/schema/projeção) que a sustentam",
      }

# ═════════════════════ FLUXO (L2) + FÍSICO (L7) ═════════════════════
flow:
  # tier de negócio (G1 · bloco B): fases LEVES de planejamento ANTES do registro — colapsáveis por perfil (scaling-law)
  - {
      phase: define-objective,
      tier: business,
      role: negocio,
      does: ["cria/revisa os business-objectives do ciclo (cascades-to; envelope L8)"],
    }
  - {
      phase: define-target,
      tier: business,
      role: "negocio + dados",
      does: ["metric-definitions + targets por objective (SoD: definer ≠ attester)"],
    }
  - {
      phase: authorize-intake,
      tier: business,
      role: "owner do objective",
      does: ["abre a porta: quais objectives aceitam propostas + allocation disponível"],
    }
  - { phase: registro, role: negocio }
  - { phase: triagem, role: eng, does: [itens, matcher-advisory, valida-contratos] }
  - { phase: investigacao, does: ["discover roda; viabilidade testada"] }
  - { phase: gate, role: humano, kind: append-only, note: "= decision-points.activate-intent" }
  - { phase: ativacao, does: [consolida, "move p/ intents/"] }
  - { phase: breakdown, role: dono, emits: ["execution-units + repo-works (heterogêneo)"] }
decision-points: # G7 + F4 — gates NOMEADOS com requisitos VERIFICÁVEIS; todos append-only e colapsáveis por perfil
  approve-objective:
    is: "aprova/encerra o business-objective do ciclo"
    subject: business-objective
    prerequisites: "target + metric-definition definidos · allocation com unidade/período/owner"
    evidence: "objective draft + targets propostos"
    approver: "owner do nível acima (no topo, o sponsor)"
    on-block: "objective fica proposed; fallback = revisar e reapresentar"
  activate-intent:
    is: "o gate que já existia no fluxo (promove candidata → intent)"
    subject: intent
    prerequisites: "business-link validado (authorized-by ativo + target + allocation, OU standalone declarado)"
    evidence: "register + triagem + investigação (quando houve)"
    approver: "owner do objective autorizador (no solo: self, logado)"
    on-block: "candidata permanece no funil; fallback = rework ou descarte"
  release-rollout:
    is: "autoriza exposição (rollout-slice/canary)"
    subject: "execution-unit (rollout-slice)"
    prerequisites: "guardrails declarados + plano de reversão (lei fallback/break-glass)"
    evidence: "baseline das métricas de guardrail + flag/canary configurados"
    approver: "dono da unit + owner do domínio exposto"
    on-block: "sem exposição; change-class emergency passa por break-glass LOGADO"
  accept-verdict:
    is: "aceita o veredito do experiment-run + o fork (won → shape-up · lost → cleanup)"
    subject: "execution-unit (experiment-run)"
    prerequisites: "outcome VÁLIDO pelo resolver (não invalid/stale; self-attested só com colapso logado)"
    evidence: "outcome publicado + decision-rule aplicada"
    approver: "owner da intent + attester independente do actual"
    on-block: "veredito segue pending; override = mutação verdict-override (dangerous, alerta q/r/d)"
physical:
  candidata: "acme-governance/registers/candidates/<id>/{register,triage,gate}.yml"
  ativada: "acme-governance/intents/<id>/intent.yml"
  por-repo: ".governance/{manifest,registry,works,context.json,backend.yml}"
  host: "acme-governance agrega os context.json publicados"
  identity: "GlobalRef family:namespace/id#anchor@revision + tombstone"
  backend: [file, sqlite, neo4j, mongo]

# ═════════════════════ EXEMPLOS (validam o modelo; o _map desenha estes) ═════════════════════
examples:
  - id: experiment-cross-repo
    label: "experimento cross-repo (growth)"
    intent: { title: "aumentar conversão trial → paid", strategy: experiment-led }
    execution-unit:
      {
        kind: experiment-run,
        title: "CTA contextual v1",
        owns: "hipótese (CTA ↑ 5%) · flag · métricas (conversion, activation) · guardrails (churn) · veredito: pending",
      }
    repo-works:
      - { repo: acme-mfe-billing, purpose: create, desc: "UI do CTA atrás da flag" }
      - { repo: acme-api-billing, purpose: create, desc: "elegibilidade + endpoint" }
      - { repo: acme-analytics, purpose: operate, desc: "eventos + baseline" }
      - { repo: acme-web-host, purpose: sustain, desc: "adaptar contexto/contrato" }
      - { repo: acme-growth-ops, purpose: operate, desc: "monitoramento pós-release" }
    contract: "acme-user-context@v3"
    note: "veredito na unit (não por repo); won→shape-up · lost→cleanup · inconclusive→novo"

  - id: redesign-misto
    label: "redesign misto (migração)"
    intent: { title: "redesign do checkout", strategy: migration-led }
    execution-unit:
      {
        kind: migration-wave,
        title: "checkout-ui v2",
        owns: "from legacy-stack → to new-stack · janela de compat: v1 + v2",
      }
    repo-works:
      - { repo: acme-checkout, purpose: sustain, desc: "portar fluxo existente (from→to)" }
      - { repo: acme-design-system, purpose: create, desc: "novos componentes" }
      - { repo: "(spike)", purpose: discover, desc: "viabilidade da migração" }
      - { repo: acme-platform, purpose: sustain, desc: "adapta contrato compartilhado" }
      - { repo: acme-checkout, purpose: operate, desc: "rollout + monitor" }
    contract: "acme-user-context@v3"
    note: "peças MISTAS sob a mesma wave — a família é da PEÇA, não da iniciativa"

  - id: contrato-compartilhado
    label: "contrato compartilhado (entre iniciativas)"
    contract:
      id: "acme-user-context@v3"
      owner: acme-platform
      consumers: "acme-mfe-billing, acme-mfe-support"
      compatibility-window: "v2, v3 até 2026-08-15"
    migrations:
      - {
          intent: redesign-checkout,
          strategy: migration-led,
          does: "migration-led — adapta o contrato",
        }
      - {
          intent: growth-upgrade,
          strategy: experiment-led,
          does: "experiment-led — consome o contrato",
        }
    note: "coordenação entre iniciativas = via o contrato (derivada); a janela mora nele (não é derivável)"

  # ── 5 situações novas (casos-limite que estressam o modelo) ──
  - id: bug
    label: "um bug"
    intent: null # standalone (ou disparado por um incident-response)
    execution-unit: null # colapsa
    repo-works:
      [
        {
          repo: acme-checkout,
          purpose: sustain,
          desc: "corrige cálculo do total · preset fix (corrective + user-visible)",
        },
      ]
    note: "bug simples = 1 repo-work sustain, SEM intent nem execution-unit (as camadas colapsam)"

  - id: dep-bump
    label: "atualização de biblioteca"
    intent: null
    execution-unit: null
    repo-works:
      [
        {
          repo: acme-web-host,
          purpose: sustain,
          desc: "atualiza lib X 3.x → 4.x · preset dep-bump (adaptive + internal)",
        },
      ]
    note: "era a P2: NÃO 'entrega valor de produto' — preserva/adapta. sustain standalone."

  - id: exploration-sem-intent
    label: "exploration sem intent"
    intent: null # descoberta independente, não amarrada a um objetivo durável
    execution-unit: null # (viraria uma discovery-unit só se fosse cross-repo)
    repo-works:
      [
        {
          repo: acme-platform,
          purpose: discover,
          desc: "spike: viável trocar o motor de busca? · timebox + pergunta falsificável → answer + fate",
        },
      ]
    note: "discover standalone, sem intent; não shippa; fate = throwaway/promoted/parked"

  - id: experiment-lost
    label: "experimento que termina em lost"
    intent: { title: "aumentar ativação via onboarding", strategy: experiment-led }
    execution-unit:
      {
        kind: experiment-run,
        title: "onboarding guiado v1",
        owns: "veredito: LOST (não bateu a métrica)",
      }
    repo-works:
      - { repo: acme-mfe-onboarding, purpose: create, desc: "fluxo guiado atrás da flag" }
      - { repo: acme-analytics, purpose: operate, desc: "eventos + baseline" }
    fork:
      { kind: cleanup, desc: "execution-unit cleanup → repo-works sustain removem flag/variante" }
    note: "lost → gera uma execution-unit CLEANUP; o valor durável foi só APRENDIZADO (nenhuma capacidade permanente)"

  - id: delivery-tradicional
    label: "delivery tradicional"
    intent: { title: "exportar relatório em PDF", strategy: direct-delivery }
    execution-unit: null # colapsa (1 repo); seria feature-slice se cross-repo
    repo-works: [{ repo: acme-reports, purpose: create, desc: "botão + geração do PDF" }]
    note: "feature comum = intent direct-delivery → repo-work create (execution-unit colapsa)"

# ═════════════════════ SIMULAÇÃO (fluxo ponta-a-ponta × forma de org) ═════════════════════
simulation:
  purpose: "quem faz o quê no fluxo de governança, em 3 formas de org — estressa SoD/independência e a cerimônia"
  phases: # F10 — inclui as fases business (bloco B)
    [
      define-objective,
      define-target,
      authorize-intake,
      registro,
      triagem,
      investigacao,
      gate,
      ativacao,
      breakdown,
      execucao,
      coordenacao,
      veredito,
    ]
  orgs:
    - id: full-team
      label: "empresa com time completo"
      roles: [PM, Design, "Team Lead", Principal, "Tech Lead", "devs Sr/Pl", "devs Jr"]
      participation:
        define-objective: "sponsor/liderança define company/area; PM traduz p/ team-priority (approve-objective no nível acima)"
        define-target: "PM (target-definer) + time de dados (metric-owner); attester ≠ definer (SoD da medição)"
        authorize-intake: "PM (owner do objective): quais objectives aceitam propostas + allocation disponível"
        registro: "PM (registered-by + owner accountable); Design + Team Lead como stakeholders"
        triagem: "Tech Lead (dispositions · matcher · valida contratos) + Principal (arquitetura/cross-repo)"
        investigacao: "devs Sr / Tech Lead rodam discover (spikes); Principal avalia viabilidade"
        gate: "PM (owner) decide promover×descartar; append-only"
        ativacao: "Team Lead / PM consolidam + movem p/ intents/"
        breakdown: "Tech Lead materializa execution-units + repo-works; Principal p/ contratos cross-repo"
        execucao: "devs Sr/Pl (create/sustain/discover); Jr (peças menores + pair)"
        coordenacao: "Principal / contract-owners; devs = consumers"
        veredito: "PM + dados (experiment-run); Tech Lead conduz shape-up/cleanup"
      sod: "HOLDS — requester (PM/dev) ≠ approver (TL/Principal) ≠ owner-attester (dono do domínio)"
      gaps:
        - "quem é dono do `operate`/monitoramento (risco de SRE-gap — cai no Principal/dev por omissão)"
        - "sobrecarga do Tech Lead (triagem + breakdown + coordenação num papel só)"
        - "dono da matcher-accountability (quem assina seguir/contrariar a sugestão)"
        - "Design como owner de contrato de design-system (fica implícito)"
    - id: trio
      label: "trio: negócio · design · engenharia"
      roles: [Negócio, Design, Engenharia]
      participation:
        define-objective: "Negócio (1-2 níveis no máximo — scaling-law)"
        define-target: "Negócio define; a FONTE de dados atesta — com a ressalva F6: fonte construída pela própria Eng = self-attested"
        authorize-intake: "Negócio"
        registro: "Negócio (registered-by + owner); Design stakeholder"
        triagem: "Engenharia (tudo: dispositions · matcher · contratos)"
        investigacao: "Engenharia (discover)"
        gate: "Negócio (owner) decide — dá a independência do lado de NEGÓCIO"
        ativacao: "Negócio + Engenharia"
        breakdown: "Engenharia"
        execucao: "Engenharia (todas as peças: create/sustain/discover/operate)"
        coordenacao: "Engenharia é owner E consumer do contrato (auto-coordenação)"
        veredito: "Negócio + Engenharia"
      sod: "PARCIAL — Negócio dá independência no gate; mas o lado TÉCNICO é auto-certificado (Eng = requester + approver + owner-attester)"
      gaps:
        - "autocertificação técnica: owner-attested-by sem verificador independente (o risco central da L9, agora ESTRUTURAL por falta de gente)"
        - "contrato sem revisão independente (mesma pessoa provê e consome)"
        - "q/r/d sem par que conteste"
        - "`operate`/monitoramento recai sobre a única pessoa de Eng"
    - id: solo
      label: "dev solo"
      roles: ["a mesma pessoa em tudo"]
      participation:
        define-objective: "self (objective opcional — perfil solo)"
        define-target: "self (target self-attested, badge no dashboard)"
        authorize-intake: "self"
        registro: "self"
        triagem: "self (quase sempre implícito)"
        investigacao: "self"
        gate: "self — 'o humano confirma' é o mesmo humano que propôs"
        ativacao: "self"
        breakdown: "self"
        execucao: "self"
        coordenacao: "self (contratos internos)"
        veredito: "self"
      sod: "IMPOSSÍVEL — todas as arestas de independência (X) e o oráculo (O1) colapsam no self"
      gaps:
        - "colapso TOTAL de independência: não há requester≠approver≠owner-attester"
        - "gate/oráculo = self → nenhuma verificação externa possível"
      degenerate-mode: "a cerimônia COLAPSA (como a execution-unit no trivial); o grafo ainda registra append-only (self-log), e a independência é EXPLICITAMENTE dispensada com trade-off LOGADO (break-glass) — não se bloqueia o solo"
  finding:
    id: F-governance-scaling
    says: "o fluxo e a Lei da Independência (X/O1) assumem TIME COMPLETO. Precisam ESCALAR PARA BAIXO por role-collapse — espelho do execution-unit-collapse (cerimônia proporcional ao tamanho da org E do trabalho). full-team: SoD holds. trio: independência TÉCNICA fica com gaps de autocertificação (mitigar com revisão cruzada / trusted-source externo). solo: SoD impossível → self-governed + trade-off logado (break-glass). Conecta as leis fallback/break-glass + independência."
    mechanized-by: "governance-profiles (G6 · bloco C)"

# ═════════════════════ BUSINESS TIER (P9 · consolidado c/ Codex) — nós de negócio ACIMA da intent ═════════════════════
# Core PEQUENO + RECURSIVO (não a árvore fixa strategy/driver/priority). Input (planejamento) + output (dashboards). Anonimizado.
business-tier:
  status: applied # gate owner 2026-07-01 — aceito junto com a scaling-law; mecanização = bloco A da P10
  provocation: P9
  source: "codex + reconciliação claude (substitui a proposta anterior de tier fixo de 5 nós)"
  core-idea: "strategy / driver / priority são o MESMO tipo (business-objective) em nível/horizonte diferente → nó RECURSIVO. Não uma árvore de 5 tipos."
  nodes:
    business-objective: "compromisso de negócio, RECURSIVO (cascades-to si mesmo). Campos: level · period · owner · parent · status. Ex. level: company-strategy | area-driver | team-priority. É o que dá a flexibilidade anual (ver annual-flexibility)."
    thesis: "hipótese CAUSAL de negócio (por que ações X devem mover a métrica Z). NÃO é objetivo — nó separado."
    opportunity-area: "espaço de ataque/opção (era 'thematic'). OPCIONAL."
    intent: "1ª unidade governada de trabalho (já existe; entra nas 3 camadas). Ganha primary-target (F2): o target primário herdado do authorizes — o rollup da intent é por ELE, e os outcomes das units sob ela devem ser compatíveis."
    metric-definition: "definição ESTÁVEL da métrica: unidade · source · aggregation · owner."
    target: "binding métrica + nó + período + valor esperado. ≠ metric-definition. actual = DERIVADO dos outcomes. Período IMUTÁVEL (F9): no fechamento do ciclo o target é FROZEN (closed) — actuals novos não entram; continuidade via continues-from (vale p/ target, não só objective)."
    outcome: "resultado GOVERNADO (G3 · bloco A): evento append-only emitido no veredito/fecho de uma execution-unit (usa envelope L8). Campos: source · window (janela de medição) · metric-definition · value · aggregation · attested-by · revision (a fonte/dados que sustentam o número) · contract-revision (quando o resultado depende de um contrato — G10). É o ÚNICO insumo de target.actual — número sem outcome válido NÃO entra no dashboard. Schema tipado + resolver: ver outcome-schema (F1)."
    allocation: "budget/capacidade/limite — começa como CAMPO do objective/priority com unidade · período · owner OBRIGATÓRIOS (G12); vira nó quando ganha lifecycle/owner/consumo PRÓPRIOS (o critério é a scaling-law)."
  edges:
    - { id: cascades-to, from: business-objective, to: business-objective }
    - {
        id: continues-from,
        from: [business-objective, target],
        to: [business-objective, target],
        note: "novo ciclo (G8; tipo-a-tipo — objective→objective · target→target, F9)",
      }
    - { id: split-from, from: business-objective, to: business-objective, note: "1 vira N (G8)" }
    - { id: merged-into, from: business-objective, to: business-objective, note: "N viram 1 (G8)" }
    - { id: framed-by, from: business-objective, to: thesis }
    - { id: explores, from: thesis, to: opportunity-area }
    - { id: authorizes, from: business-objective, to: intent }
    - { id: measured-by, from: business-objective, to: target }
    - { id: uses, from: target, to: metric-definition }
    - {
        id: emits,
        from: execution-unit,
        to: outcome,
        note: "no veredito/fecho da unit; repo-work STANDALONE também emite (G14)",
      }
    - {
        id: contributes-to,
        from: outcome,
        to: target,
        note: "ENTRA no rollup/dashboard; exige regra de agregação declarada (lint em rollup-mechanics)",
      }
    - {
        id: aligns-with,
        from: node,
        to: business-objective,
        note: "alinhamento NARRATIVO; NÃO entra em rollup (evita contabilidade falsa)",
      }
  rollup-rule: "cada intent/outcome tem UM objetivo PRIMÁRIO de rollup (contributes-to); secundários = aligns-with (contexto, não soma) — senão uma iniciativa que 'apoia' 3 prioridades vira resultado TRIPLICADO."
  measurement-roles: # G4 (bloco A) — o SoD da medição vira papel NOMEADO
    target-definer: "define o target (binding métrica × nó × período × valor)"
    metric-owner: "dono da metric-definition (unidade · source · aggregation)"
    actual-attester: "atesta o outcome — o número E a fonte/revision que o sustenta. É uma AUTHORITY resolvível (pessoa OU trust-boundary com owner — F6); MÁQUINA só atesta se o producer/owner da fonte for INDEPENDENTE de quem define o target — senão a atestação é marcada collapsed/self-attested"
    dashboard-consumer: "audiência que lê o rollup (só lê, não muda)"
    sod: "target-definer NÃO pode ser o ÚNICO actual-attester (fonte/analytics independente — a lei da independência aplicada à medição; era o new-sod da scaling-law)"
    role-collapse: "pela scaling-law: trio → o attester tende a colapsar na mesma eng (gap LOGADO); solo → colapso total, dispensa EXPLÍCITA logada (break-glass) e o dashboard marca self-attested"
  rollup-mechanics: # G5 (bloco A) — regras VERIFICÁVEIS (lint), não prosa
    lint:
      - "exatamente 1 contributes-to (rollup primário) por outcome/intent — 2+ = ERRO (contabilidade dupla)"
      - "contributes-to sem aggregation declarada = ERRO (o outcome não entra no dashboard)"
      - "aligns-with NUNCA soma — o dashboard ignora (contexto narrativo)"
      - "outcome sem attested-by OU com revision stale/incompatível → número marcado unverified/stale no dashboard (falha VISÍVEL, não silenciosa — lei dependencia-verificavel)"
      - "outcome que depende de contrato CITA a contract-revision; revision fora da compatibility-window → dashboard marca blocked/stale (G10 — a lei dependencia-verificavel mecanizada p/ o rollup)"
      - "coerência intent × outcome (F2): outcome de unit sob uma intent só soma no primary-target DELA; somar noutro target exige decision explícita registrada — senão INVALID"
      - "target FROZEN/closed não recebe actual novo (F9) — outcome com window fora do período do target vai p/ o target continuador (continues-from) ou fica unassigned VISÍVEL"
      - "mutação dangerous com justificativa mas SEM q/r/d anexado → o nó/número afetado carrega a marca dangerous-unreviewed no dashboard até reviewer/decision fechar (F11 — detecção; no perfil FULL o subconjunto ruler-authority é soft-mandatory: ver deliberation.enforcement)"
    standalone: "G14 — trabalho sem objective TAMBÉM emite outcome: ou contributes-to um target (quando fizer sentido) ou cai no bucket OPERACIONAL do dashboard (custo/risco) — visível, fora do rollup de objectives; nada some"
  outcome-schema: # F1+F8 (bloco D) — o outcome deixa de ser prosa: campos TIPADOS + refs resolvíveis + resolver fail-closed
    fields:
      source: "GlobalRef RESOLVÍVEL da fonte (ex.: metric-source:acme-analytics/conversion@rev) — não string livre"
      window: "período de medição (start · end), fechado e imutável"
      metric-definition: "GlobalRef da metric-definition usada (a unidade do value DEVE bater com ela)"
      value: "número + unidade"
      aggregation: "regra declarada (sum · avg · last · custom com owner)"
      attested-by: "AUTHORITY resolvível (pessoa OU trust-boundary com owner) — ver measurement-roles"
      revision: "revisão dos DADOS que sustentam o número (dataset/query@rev)"
      contract-revisions: "F8: DERIVADAS do grafo — toda repo-work da unit com coordinates-with → contract entra na lista; NÃO é autodeclarada (omissão não passa despercebida)"
    resolver:
      is: "verificação OBRIGATÓRIA em actual-publish E na leitura do dashboard — a peça que PROVA que número, fonte, revisão e autoridade são válidos (barra do red-team)"
      checks:
        - "toda ref RESOLVE (source · metric-definition · attested-by · revision · contract-revisions) — ref quebrada = INVALID"
        - "attested-by é authority AUTORIZADA p/ a metric-definition e ≠ target-definer — senão marcado self-attested"
        - "revision dentro de ttl/janela — senão STALE"
        - "contract-revisions COBREM as derivadas do grafo e estão na compatibility-window — senão BLOCKED/STALE"
      fail-mode: "fail-CLOSED p/ SOMAR (invalid/stale/blocked/self-attested-sem-colapso-logado não entram no actual) · fail-VISIBLE p/ EXIBIR (tudo aparece no dashboard, com a marca)"
  input-vs-output:
    input: "business-objective → thesis → opportunity-area → intent"
    output: "outcome → target.actual → dashboard do objective (sobe SÓ por contributes-to, com agregação declarada)"
  annual-flexibility: "objetivos versionados POR CICLO: novo ciclo = novos business-objective (status closed/active · continues-from/supersedes/split/merge — desde o G8, no catálogo de states/edges), NÃO mudança de schema. level/nomes = LABEL configurável. Usa o envelope L8 (append-only/supersedes) → mudança anual vira DADO, preserva histórico/comparação; não é migração ontológica."
  fork-resolvido: "core FIXO + níveis CONFIGURÁVEIS (nem 5 nós fixos, nem grafo plugável livre). Core = business-objective · thesis · opportunity-area · metric-definition/target · intent. Domínio configura business-objective.level. Tipo NOVO só com CONTRATO (owner · lifecycle · arestas · rollup · regra-de-colapso · impacto-no-dashboard)."
  two-hypotheses: "não conflar: thesis = hipótese de NEGÓCIO (estratégica) ≠ experiment-run.hypothesis = hipótese TÁTICA (da execution-unit). Níveis diferentes."
  connects: "features.md P2 (portfólio: RICE/ICE, roadmap, priorização)"
  example: # instância ILUSTRATIVA do grafo completo (o _map desenha esta cadeia; data.js é gerado daqui)
    objective:
      - { level: company-strategy, title: "crescer receita via plataforma", period: "2027" }
      - { level: area-driver, title: "cross-sell entre produtos", period: "2027-H1" }
      - {
          level: team-priority,
          title: "P1 · +X% de conversão de cross-sell",
          period: "2027-H1",
          meta: "target: conversion-rate · budget: orçamento H1",
        }
    thesis: "ofertar o produto B à base do produto A, evidenciando o uso conjunto, move a conversão"
    opportunities: ["jornada de cross-sell unificada", "personalização da oferta"]
    intent: { title: "testar CTA contextual de upgrade", strategy: experiment-led }
    unit: { kind: experiment-run, title: "CTA contextual v1", verdict: won }
    works:
      - { repo: acme-mfe-billing, purpose: create, desc: "UI do CTA atrás da flag" }
      - { repo: acme-analytics, purpose: operate, desc: "eventos + baseline (mede a métrica)" }
      - { repo: acme-web-host, purpose: sustain, desc: "adapta o contrato compartilhado" }
    outcome:
      title: "resultado do experimento (won)"
      fields: "source: acme-analytics · janela: H1 · valor: +X% · attested-by: acme-data (≠ quem definiu o target) · revision: dados@rev"
      note: "único insumo do target.actual — sem attester independente ou com revision stale, o dashboard marca unverified/stale (falha visível, não silenciosa)"
    measurement:
      metric: "conversion-rate · source: acme-analytics · owner: acme-data"
      target: "H1: +X% · actual = DERIVADO dos outcomes (não à mão)"
      roles: "papéis: target-definer · metric-owner · actual-attester · dashboard-consumer — quem define o target NÃO é o único a atestar o actual"
    rollup:
      contributes: "o outcome CONTRIBUI (mensurável) p/ a priority P1 → entra no dashboard (rollup primário)"
      aligns: "e ALINHA (narrativo) com a company-strategy → contexto, NÃO soma no dashboard"
      lint: "lint: exatamente 1 rollup primário por outcome/intent · aggregation obrigatória · aligns-with nunca soma"

# ═════════════════════ LEI ÚNICA DE ESCALA (Codex — generaliza F-governance-scaling) ═════════════════════
scaling-law:
  status: applied # gate owner 2026-07-01
  says: "crie um NÓ separado só quando muda pelo menos um: owner · cadência · target próprio · allocation própria · lifecycle próprio · audiência de dashboard. Se nada muda, COLAPSE."
  applies-to: [business-tier, execution-unit, "roles/SoD"]
  generalizes: "F-governance-scaling + execution-unit-collapse — um princípio só p/ camadas de trabalho + tier de negócio + papéis"
  new-sod: "quem DEFINE o target não deve ser o único a ATESTAR o actual (fonte/analytics independente)"
  executed-by: governance-profiles # G6 (bloco C)

# ═════════════════════ PERFIS DE GOVERNANÇA (G6+G13 · bloco C) — a scaling-law EXECUTÁVEL ═════════════════════
governance-profiles:
  is: "perfis operacionais mínimos por forma de org (G6): cada perfil diz que NÓS existem, que GATES colapsam e que CAMPOS são obrigatórios — colapso LIMPO, não princípio abstrato"
  law: "a org declara UM perfil + desvios EXPLÍCITOS; mudar de perfil = mutação profile-change (dangerous). Perfis derivam por role-collapse parametrizado (G13) — o compact cobre o small-team (PM+TL+eng) sem um 4º arquétipo fixo"
  declaration: # F5 (bloco E) — declarar perfil deixa de ser autoatribuição livre (perfil como bypass)
    fields: [scope, profile, eligibility, approved-by, ttl, review-at]
    eligibility: "compact/solo exigem elegibilidade DECLARÁVEL e verificável (nº de pessoas/papéis no escopo); org com papéis separados NÃO é elegível a solo — o dev solo REAL nunca é bloqueado"
    approver: "declaração de compact/solo por um GRUPO exige approver FORA do escopo (SoD aplicado ao próprio perfil); solo individual = self, com badge"
    ttl: "toda declaração tem ttl/review-at; vencida → dashboard marca profile-stale"
    badge: "o perfil (e os desvios) aparece como BADGE nos dashboards/rollups do escopo — self-attested/collapsed é VISÍVEL, nunca implícito"
  profiles:
    full:
      for: "org com papéis separados (a full-team da simulação)"
      nodes: "business-tier completo + 3 camadas + contract + intake + outcome"
      gates: [approve-objective, activate-intent, release-rollout, accept-verdict]
      sod: "completo — requester ≠ approver ≠ owner-attester · target-definer ≠ actual-attester"
      required-fields: "envelope L8 inteiro · outcome com attester independente · aggregation declarada"
      enforcement: "F11 (opção C): mutação ruler-authority SEM par = BLOQUEADA (soft-mandatory; break-glass logado + revisão retroativa é a saída); demais dangerous = detecção (dangerous-unreviewed)"
    compact:
      for: "time pequeno (o trio da simulação; o small-team deriva daqui por role-collapse)"
      nodes: "business-objective (1-2 níveis) + intent + execution-unit (colapsa no trivial) + repo-work + outcome"
      gates: "activate-intent + accept-verdict; os demais colapsam no MESMO humano, com colapso LOGADO"
      sod: "independência de negócio no gate; autocertificação técnica DECLARADA como gap + mitigação (revisão cruzada / trusted-source externo)"
      required-fields: "outcome ainda exige attester (pode ser a FONTE de dados, não uma pessoa) · aggregation declarada"
      enforcement: "F11: tudo detecção (dangerous-unreviewed) + revisão retroativa em CADÊNCIA (não trava)"
    solo:
      for: "dev solo"
      nodes: "repo-work + outcome self-attested; intent/objective opcionais (colapsam)"
      gates: "nenhum — self-log append-only substitui (break-glass permanente, logado)"
      sod: "dispensado EXPLICITAMENTE com trade-off logado; dashboard marca self-attested"
      required-fields: "registro append-only (o grafo continua contando a história)"
      enforcement: "F11: detecção/self-log — não se bloqueia o solo"

# ═════════════════════ VALIDAÇÃO DE FLUXO (P10 · rodada Codex big-company → solo) ═════════════════════
# Gaps RECONCILIADOS contra este arquivo (repo vence): aceito · parcial (o modelo já cobre parte — a
# correção diz o quê) · tensão (choca com decisão anterior da owner). Severidade = do Codex
# (P0 crítico · P1 importante · P2 menor — NÃO confundir com ids de provocação).
flow-validation:
  status: applied # todos os 14 gaps têm resolution (G11 = decision); resta o hardening via revisão adversarial
  gate: "owner 2026-07-01 (1º) — bloco A (G3+G4+G5) AUTORIZADO e APLICADO · G11 DECIDIDO (alerta + justificativa logada; não obrigatório) · business-tier + scaling-law ACEITOS (proposed → applied). owner 2026-07-01 (2º) — TODAS as frentes: blocos B (G1+G2) e C (G6+G13), fila P1 (G7·G8·G9·G10·G12) e G14 APLICADOS (ver resolution por gap) + gerador model.yml → _map. Próximo: revisão adversarial técnica/arquitetural (Codex)"
  provocation: P10
  source: "codex (validação ponta-a-ponta + caça a gaps, big → solo) + reconciliação claude 2026-07-01"
  verdict-codex: "coerente como mapa conceitual do big-company ao solo; NÃO pronto como framework ponta-a-ponta — falta mecanizar business-tier + rollup (ecoa o achado-mestre do red-team: o modelo é SUB-mecanizado, não over-engineered)"
  master-gap: "outcome → target.actual → dashboard: o modelo diz que actual é DERIVADO e que só contributes-to soma, mas NÃO define o que é um outcome GOVERNADO, quem atesta o actual, que revisão/fonte sustenta o número, nem como o dashboard falha com evidência stale. Sem isso o business-tier vira painel narrativo, não governança. (= G3 + G4 + G5)"
  gaps:
    - id: G1
      about: "business-tier existe como grafo, mas não como FLUXO operacional"
      where: "antes de registro — criação/aprovação de objective · thesis · target · allocation"
      severity: P0
      scale: [big, mid]
      reconciliation: "aceito — FATO: flow (L2) começa em registro; nenhuma fase cobre o planejamento; business-tier tem input-vs-output mas não diz QUEM cria/aprova QUANDO"
      suggestion: "fases leves de planejamento (define-objective · define-target · authorize-intake), colapsáveis em org menor"
      resolution: "APLICADO (bloco B) — flow ganha as 3 fases de tier business (define-objective · define-target · authorize-intake), colapsáveis por perfil"
    - id: G2
      about: "intake não está ligado ao business-tier"
      where: "registro → gate → ativação"
      severity: P0
      scale: [big, mid, trio]
      reconciliation: "aceito — FATO: a aresta authorizes (objective → intent) existe, mas proposal/register não declaram vínculo; o gate não valida objective/target/allocation. Os exemplos com intent nula mostram que 'standalone' precisa ser DECLARÁVEL (não inferido)"
      suggestion: "register/proposal declara authorized-by OU standalone; gate valida objective primário + target + allocation"
      resolution: "APLICADO (bloco B) — intake.business-link (authorized-by OU standalone, declarado; gate valida objective ativo + target + allocation)"
    - id: G3
      about: "target.actual é 'derivado', mas falta a entidade/processo de OUTCOME"
      where: "veredito → dashboard"
      severity: P0
      scale: [big, mid, trio]
      reconciliation: "aceito (o master-gap) — FATO que REFORÇA: outcome já é citado 2× no modelo (closed-by → 'answer|outcome|postmortem' · contributes-to parte de 'outcome (execution-unit)') e definido em lugar NENHUM"
      suggestion: "outcome como evento/nó governado: source · janela · métrica · agregação · attester · revision"
      resolution: "APLICADO (bloco A) — business-tier.nodes.outcome + aresta emits (execution-unit → outcome)"
    - id: G4
      about: "o SoD novo do target está só DECLARADO"
      where: "planejamento + dashboard"
      severity: P0
      scale: [big, mid, trio, solo]
      reconciliation: "aceito — FATO: scaling-law.new-sod declara sem mapear papéis; a barra do red-team r2 já disse 'P0 nomeado sem mecanismo = cerimônia'"
      suggestion: "papéis: target-definer · metric-owner · actual-attester · dashboard-consumer; no solo, colapso EXPLÍCITO logado"
      resolution: "APLICADO (bloco A) — business-tier.measurement-roles (4 papéis + sod + role-collapse)"
    - id: G5
      about: "contributes-to × aligns-with não está mecanizado"
      where: "breakdown · veredito · rollup"
      severity: P0
      scale: [big, mid]
      reconciliation: "aceito — FATO: rollup-rule é textual; o próprio modelo exige enforcement p/ dimensões ('senão é tag decorativa') — o mesmo princípio vale p/ o rollup"
      suggestion: "lint: exatamente 1 rollup primário por outcome/intent; dashboard ignora aligns-with; agregação obrigatória"
      resolution: "APLICADO (bloco A) — business-tier.rollup-mechanics (4 regras de lint)"
    - id: G6
      about: "scaling-law é princípio, não perfil executável"
      where: "todas as fases"
      severity: P0
      scale: [mid, trio, solo]
      reconciliation: "aceito — governance-profile é a materialização EXECUTÁVEL da scaling-law (conecta F-governance-scaling + degenerate-mode do solo)"
      suggestion: "governance-profile (full · compact · solo): nós mínimos, gates colapsados e campos obrigatórios por perfil"
      resolution: "APLICADO (bloco C) — seção governance-profiles (full · compact · solo): nodes/gates/sod/required-fields por perfil + lei do desvio explícito"
    - id: G7
      about: "gate único não cobre decisões por tier"
      where: "objective approval · activation · rollout · verdict"
      severity: P1
      scale: [big, mid]
      reconciliation: "aceito — FATO: o fluxo tem UM gate (pré-ativação); verdict/rollout/aprovação-de-objective não têm decision-point governado"
      suggestion: "decision-points separados (approve-objective · activate-intent · release/rollout · accept-verdict), todos colapsáveis"
      resolution: "APLICADO (fila P1) — seção decision-points (4 gates nomeados, append-only, colapsáveis por perfil); o gate do fluxo = activate-intent"
    - id: G8
      about: "states genéricos demais p/ o business-tier"
      where: "objective anual · target · reopen/supersede"
      severity: P1
      scale: [big, mid]
