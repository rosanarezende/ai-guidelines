# ═════════════════════ PROPOSTA EM VALIDAÇÃO (P12 · strategy → abordagem binária + SINAIS derivados) ═════════════════════
# NADA aplicado nas layers ainda — a owner valida via _map/flow-explorer.html (gerado DESTA seção).
# Quando aceita: substitui layers.intent.strategy (enum de 4) e aplica os renames.
approach-proposal:
  status: proposed
  provocation: P12
  source: "owner (fricção de adoção + 'por que migração/confiabilidade são apostas?') + claude (matriz 2 eixos) + codex (adotar-com-ajustes: regra de ouro · natureza como retrato · aplicabilidade)"
  replaces: "layers.intent.strategy (enum experiment-led/direct-delivery/migration-led/reliability-led)"
  approach:
    id: approach
    label: abordagem
    values:
      validate-first: "validar antes — o compromisso permanente DEPENDE da evidência"
      direct: "entregar direto — a mudança já está decidida; métricas só protegem qualidade/rollout"
    golden-rule: "é validate-first SÓ se a evidência decide a mudança permanente; canary, guardrail e spike NÃO tornam nada validate-first"
    lint: "validate-first exige hipótese + decision-rule na unit líder; sem isso, alerta (dá dente à regra de ouro)"
    applicability: "só intent PLANEJADA que pretende mudança governada; bug, reativo, descoberta avulsa e operação não têm o campo — a camada colapsa (não existe 'não se aplica' em dropdown)"
    drift: "unidades divergindo da abordagem declarada → alerta approach-drift (não bloqueia; substitui o strategy-drift)"
    naming-note: "nomes decididos pela owner: approach · graduation · direct (bet, commit-direct e deliver-direct REJEITADOS — conotação de jogo/git)"
  signals:
    is: "SINAIS concretos do trabalho descrito ligam os mecanismos — SEM conceito intermediário. A 'natureza' foi REMOVIDA (decisão owner 2026-07-02: dois vocabulários p/ a mesma coisa = fricção; os sinais bastam). O portfólio agrega POR SINAL (quanto do trabalho toca contrato × meta operacional × caminho curto); divergência entre o sugerido na autoria e o observado nas peças = alerta signal-drift"
    list:
      - {
          id: touches-contract,
          signal: "as peças portam algo de → para, OU tocam contrato de que outros dependem",
          wakes: "janela de compatibilidade (mora no CONTRATO) + consumidores avisados + dashboard de onda (blocked/stale se incompatível)",
          form-if-multi-repo: migration-wave,
        }
      - {
          id: operational-target,
          signal: "a meta é SLO / risco / custo operacional (não métrica de produto)",
          wakes: "o placar vira OPERACIONAL + guardrails; peças sustain (preventivo) e operate",
          form-if-multi-repo: "quase nunca vira unit — colapsa em peças",
        }
      - {
          id: none,
          signal: "nenhum dos sinais acima",
          wakes: "caminho CURTO — nenhuma cerimônia extra; release gradual opcional (release-rollout)",
          form-if-multi-repo: delivery-slice,
        }
  derivation: # abordagem × sinal × escopo → a forma (NUNCA menu)
    - {
        approach: validate-first,
        signal: any,
        form: experiment-run,
        note: "o sinal diz O QUE se valida: none = experimento de produto · touches-contract = migração com canary DECISÓRIO · operational-target = experimento de performance",
      }
    - { approach: direct, signal: none, multi-repo: true, form: delivery-slice }
    - { approach: direct, signal: none, multi-repo: false, form: "colapsa — repo-work create" }
    - { approach: direct, signal: touches-contract, multi-repo: true, form: migration-wave }
    - {
        approach: direct,
        signal: touches-contract,
        multi-repo: false,
        form: "colapsa — repo-work sustain (porte simples)",
      }
    - {
        approach: direct,
        signal: operational-target,
        multi-repo: any,
        form: "quase sempre colapsa — sustain/operate; unit só com coordenação real",
      }
  consequences: "veredito ganhou → graduation (efetivação) · perdeu → cleanup (limpeza) · release gradual → release-rollout · alerta/evento → incident-response (reativo, fora da abordagem)"
  no-approach-paths:
    - "bug/reativo → resposta a incidente OU peça sustain direto"
    - "descoberta avulsa (1 repo) → peça discover (timebox + pergunta falsificável + fate)"
    - "pergunta compartilhada cross-repo → discovery (unit derivada; fecha a Q-discover-level)"
    - "operação avulsa → peça operate (outcome no bucket operacional)"
  renames: # tabela final de nomes (approach · graduation decididos pela owner)
    - { from: strategy, to: approach, label: abordagem, note: "campo da intent; 4 valores → 2" }
    - {
        from: feature-slice,
        to: delivery-slice,
        label: "fatia de entrega",
        note: "nem toda entrega é feature",
      }
    - {
        from: shape-up,
        to: graduation,
        label: efetivação,
        note: "termo do mundo de feature flags; o antigo era jargão de outro método",
      }
    - {
        from: rollout-slice,
        to: release-rollout,
        label: "rollout de release",
        note: "fase; só vira unit com vida própria",
      }
    - {
        from: null,
        to: discovery,
        label: descoberta,
        note: "NOVO — pergunta compartilhada cross-repo",
      }
  example-org: # org-base p/ validação camada a camada (owner): 2 objetivos de empresa · 2 áreas · 5 times · 1 intent por abordagem
    company: acme
    objectives:
      - { id: obj-revenue, level: company, title: "crescer receita via cross-sell", period: "2027" }
      - { id: obj-efficiency, level: company, title: "reduzir o custo de servir", period: "2027" }
    areas:
      - {
          id: area-growth,
          title: "área de growth",
          cascades-from: obj-revenue,
          driver: "cross-sell entre os produtos",
        }
      - {
          id: area-platform,
          title: "área de plataforma",
          cascades-from: obj-efficiency,
          driver: "eficiência e confiabilidade da plataforma",
        }
    teams:
      - { id: time-billing, area: area-growth, priority: "P1 · +X% de conversão de cross-sell" }
      - { id: time-onboarding, area: area-growth, priority: "P2 · +Y% de ativação no onboarding" }
      - {
          id: time-checkout,
          area: area-platform,
          priority: "P1 · checkout no stack novo até o fim do H2",
        }
      - { id: time-data, area: area-platform, priority: "P2 · -Z% no custo da infra de dados" }
      - {
          id: time-sre,
          area: area-platform,
          priority: "P1 · p99 abaixo de N ms · -30% de incidentes",
        }
    intents:
      - id: intent-cta-upgrade
        team: time-billing
        authorized-by: obj-revenue
        title: "CTA contextual de upgrade no billing"
        approach: validate-first
        signal: none
        derived: "experiment-run — hipótese (CTA ↑ conversão em X%) + flag + métricas + guardrails; veredito: ganhou → graduation · perdeu → cleanup"
      - id: intent-checkout-stack
        team: time-checkout
        authorized-by: obj-efficiency
        title: "migrar o checkout para o stack novo"
        approach: direct
        signal: touches-contract
        derived: "migration-wave — porta de → para em 3 repos; janela de compatibilidade do contrato acme-user-context; consumidores avisados; corte gradual → release-rollout"
      - id: intent-p99-hardening
        team: time-sre
        authorized-by: obj-efficiency
        title: "derrubar o p99 da plataforma (timeouts, retries, cache)"
        approach: direct
        signal: operational-target
        derived: "quase sempre COLAPSA — peças sustain (preventivo) e operate direto nos repos; o placar é OPERACIONAL (SLO p99, incidentes), não métrica de produto; guardrails no dashboard"
  artifact: "_map/flow-explorer.html (gerado desta seção por _map/generate.mjs)"

