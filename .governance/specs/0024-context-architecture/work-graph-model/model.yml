      suggestion: "separar intent.primary-target (vem do authorizes) do contributes-to do outcome; outcome só soma se compatível com o primary-target OU com decision explícita"
      resolution: "APLICADO (bloco F) — intent.primary-target (herdado do authorizes) + lint de coerência intent × outcome em rollup-mechanics"
    - id: F3
      about: "mutation-types burlável: dangerous é string e faltam tipos (profile-change · metric-definition-change · business-link-change · aggregation-change · break-glass como tipo real)"
      severity: P0
      reconciliation: "aceito — inconsistência interna CONFIRMADA: governance-profiles.law exige 'mudar de perfil = mutação L8' mas profile-change não existe no catálogo"
      suggestion: "dangerous como lista ENUMERADA · adicionar os tipos ausentes · fail-closed p/ mutação desconhecida ou incompatível com o diff"
      resolution: "APLICADO (bloco E) — mutation-types: +metric-definition-change/aggregation-change/business-link-change + grupo governance (profile-change · break-glass); dangerous enumerado; unknown-mutation fail-closed"
    - id: F4
      about: "decision-points são nome + descrição, sem requisitos verificáveis por gate"
      severity: P1
      reconciliation: "aceito — accept-verdict sem outcome verificável, release-rollout sem evidência de guardrail, approve-objective sem target/metric-definition"
      suggestion: "por decision-point: subject-ref · prerequisites · required-evidence · authorized-approver · block/fallback"
      resolution: "APLICADO (bloco G) — os 4 decision-points viraram mapas com subject/prerequisites/evidence/approver/on-block"
    - id: F5
      about: "perfil autodeclarado vira bypass: org grande se declara compact/solo e escapa do SoD"
