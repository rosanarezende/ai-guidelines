# ═════════════════════ MODELO DE APPROACH (P12 aplicado · enum strategy removido) ═════════════════════
# Este bloco alimenta flow-explorer/flow-generic e detalha a regra aplicada em layers.intent.
approach-model:
  status: applied
  provocation: P12
  source: "owner (fricção de adoção + 'por que migração/confiabilidade são apostas?') + claude (matriz 2 eixos) + codex (adotar-com-ajustes: regra de ouro · natureza como retrato · aplicabilidade)"
  replaces: "layers.intent.strategy (enum experiment-led/direct-delivery/migration-led/reliability-led)"
  approach:
    id: approach
    label: abordagem
    values:
      validate-first: "validar antes — o compromisso permanente DEPENDE da evidência"
      direct: "entregar direto — a mudança já está decidida; métricas só protegem qualidade/rollout"
    golden-rule: "é validate-first SÓ se a evidência decide a mudança permanente; canary, guardrail e spike NÃO tornam nada validate-first"
    lint: "validate-first exige hipótese + decision-rule na unit líder; sem isso, alerta (dá dente à regra de ouro)"
    applicability: "só intent PLANEJADA que pretende mudança governada; bug, reativo, descoberta avulsa e operação não têm o campo — a camada colapsa (não existe 'não se aplica' em dropdown)"
    drift: "unidades divergindo da abordagem declarada → alerta approach-drift (não bloqueia; substitui o strategy-drift)"
    naming-note: "nomes decididos pela owner: approach · graduation · direct (bet, commit-direct e deliver-direct REJEITADOS — conotação de jogo/git)"
  culture-note: "GROWTH COMO CULTURA (owner, 2026-07-02): validate-first é abordagem de QUALQUER time — não propriedade de uma área. Áreas de growth podem ter times dedicados, mas a cultura incentiva todos a experimentar: um time de plataforma pode carregar target de receita e rodar experimento (ex.: checkout-1click na sim v3, time-checkout → obj-revenue). O dashboard MEDE a cultura: % de intents validate-first por área (derivado do grafo, não declarado)"
  signals:
    is: "SINAIS concretos do trabalho descrito ligam os mecanismos — SEM conceito intermediário. A 'natureza' foi REMOVIDA (decisão owner 2026-07-02: dois vocabulários p/ a mesma coisa = fricção; os sinais bastam). O portfólio agrega POR SINAL (quanto do trabalho toca contrato × meta operacional × caminho curto); divergência entre o sugerido na autoria e o observado nas peças = alerta signal-drift"
    list:
      - {
          id: touches-contract,
          signal: "as peças MUDAM um contrato (qualquer revisão) ou portam algo de → para. CONSUMIR um contrato sem revisão NÃO é sinal",
          wakes: "revisão → review do OWNER do contrato (externo ao time da intent); revisão com QUEBRA → além do review, abre a janela de compatibilidade (que mora no CONTRATO) + consumidores migram + dashboard de onda (blocked/stale se incompatível)",
          form-if-multi-repo: migration-wave,
        }
      - {
          id: operational-target,
          signal: "a meta é SLO / risco / custo operacional (não métrica de produto)",
          wakes: "o placar vira OPERACIONAL + guardrails; peças sustain (preventivo) e operate",
          form-if-multi-repo: "quase nunca vira unit — colapsa em peças",
        }
      - {
          id: none,
          signal: "nenhum dos sinais acima",
          wakes: "caminho CURTO — nenhuma cerimônia extra; release gradual opcional (release-rollout)",
          form-if-multi-repo: delivery-slice,
        }
  review-rule: "review EXTERNO nunca se escolhe — DERIVA: (a) peça em repo de OUTRO time → review do dono do repo · (a2) repo GRANDE DEMAIS p/ um time (monolito) tem donos por MÓDULO (padrão CODEOWNERS): a peça declara o módulo e o review é do dono do MÓDULO; o repo mantém um CUSTODIÃO p/ o que não é de módulo nenhum (build/CI) — a accountability é sempre do nó MAIS ESPECÍFICO declarado, nunca some · (b) mudança de contrato → review do owner do contrato + consumidores avisados · (c) revisão com quebra → além do review, abre a janela. Impacta PRAZO: os reviews externos aparecem no plano da intent DESDE o breakdown (combinados com os stakeholders, não descobertos no meio)"
  deps-rule: "DOIS tipos de dependência entre peças: blocked-by = NÃO COMEÇA (falta decisão/insumo — não dá p/ paralelizar; ex.: o fate do spike decide o que construir) · delivery-after = PARALELIZA o trabalho, mas a ENTREGA/ativação espera (integração, baseline, janela; ex.: a UI constrói com mock e integra quando o endpoint sai). O dashboard mostra os dois estados: bloqueada × em paralelo aguardando entrega. Usa a aresta blocked-by do modelo (estado blocked DERIVADO); delivery-after é a variante fraca"
  derivation: # abordagem × sinal × escopo → a forma (NUNCA menu)
    - {
        approach: validate-first,
        signal: any,
        form: experiment-run,
        note: "o sinal diz O QUE se valida: none = experimento de produto · touches-contract = migração com canary DECISÓRIO · operational-target = experimento de performance",
      }
    - { approach: direct, signal: none, multi-repo: true, form: delivery-slice }
    - { approach: direct, signal: none, multi-repo: false, form: "colapsa — repo-work create" }
    - { approach: direct, signal: touches-contract, multi-repo: true, form: migration-wave }
    - {
        approach: direct,
        signal: touches-contract,
        multi-repo: false,
        form: "colapsa — repo-work sustain (porte simples)",
      }
    - {
        approach: direct,
        signal: operational-target,
        multi-repo: any,
        form: "quase sempre colapsa — sustain/operate; unit só com coordenação real",
      }
  consequences: "veredito ganhou → graduation (efetivação) · perdeu → cleanup (limpeza) · release gradual → release-rollout · alerta/evento → incident-response (reativo, fora da abordagem)"
  no-approach-paths:
    - "bug/reativo → resposta a incidente OU peça sustain direto"
    - "descoberta avulsa (1 repo) → peça discover (timebox + pergunta falsificável + fate)"
    - "pergunta compartilhada cross-repo → discovery (unit derivada; fecha a Q-discover-level)"
    - "operação avulsa → peça operate (outcome no bucket operacional)"
  renames: # tabela final de nomes (approach · graduation decididos pela owner)
    - { from: strategy, to: approach, label: abordagem, note: "campo da intent; 4 valores → 2" }
    - {
        from: feature-slice,
        to: delivery-slice,
        label: "fatia de entrega",
        note: "nem toda entrega é feature",
      }
    - {
        from: shape-up,
        to: graduation,
        label: efetivação,
        note: "termo do mundo de feature flags; o antigo era jargão de outro método",
      }
    - {
        from: rollout-slice,
        to: release-rollout,
        label: "rollout de release",
        note: "fase; só vira unit com vida própria",
      }
    - {
        from: null,
        to: discovery,
        label: descoberta,
        note: "NOVO — pergunta compartilhada cross-repo",
      }
  example-org: # org-base p/ validação camada a camada (owner): 2 objetivos de empresa · 2 áreas · 5 times · 1 intent por abordagem
    company: acme
    objectives:
      - { id: obj-revenue, level: company, title: "crescer receita via cross-sell", period: "2027" }
      - { id: obj-efficiency, level: company, title: "reduzir o custo de servir", period: "2027" }
    areas:
      - {
          id: area-growth,
          title: "área de growth",
          cascades-from: obj-revenue,
          driver: "cross-sell entre os produtos",
        }
      - {
          id: area-platform,
          title: "área de plataforma",
          cascades-from: obj-efficiency,
          driver: "eficiência e confiabilidade da plataforma",
        }
    teams:
      - { id: time-billing, area: area-growth, priority: "P1 · +X% de conversão de cross-sell" }
      - { id: time-onboarding, area: area-growth, priority: "P2 · +Y% de ativação no onboarding" }
      - {
          id: time-checkout,
          area: area-platform,
          priority: "P1 · checkout no stack novo até o fim do H2",
        }
      - { id: time-data, area: area-platform, priority: "P2 · -Z% no custo da infra de dados" }
      - {
          id: time-sre,
          area: area-platform,
          priority: "P1 · p99 abaixo de N ms · -30% de incidentes",
        }
    repos: # o terreno: repos existentes (owner = time; caps = capabilities declaradas no manifesto — alimentam o matcher)
      - { id: acme-mfe-billing, owner: time-billing, caps: "billing-ui · planos · upgrade" }
      - {
          id: acme-api-billing,
          owner: time-billing,
          caps: "cobrança · elegibilidade · assinaturas",
        }
      - { id: acme-mfe-onboarding, owner: time-onboarding, caps: "onboarding · ativação · tours" }
      - { id: acme-checkout, owner: time-checkout, caps: "checkout-ui · carrinho · cupom · frete" }
      - { id: acme-checkout-api, owner: time-checkout, caps: "pedidos · pagamento · frete-api" }
      - { id: acme-analytics, owner: time-data, caps: "eventos · métricas · experimentos (fonte)" }
      - { id: acme-data-pipeline, owner: time-data, caps: "ETL · warehouse" }
      - { id: acme-obs-stack, owner: time-sre, caps: "alertas · SLO · tracing (atesta outcomes)" }
      - {
          id: acme-web-host,
          owner: area-platform,
          caps: "shell dos MFEs · contexto de usuário · roteamento",
          note: compartilhado,
        }
      - {
          id: acme-design-system,
          owner: area-platform,
          caps: "componentes · tokens",
          note: compartilhado,
        }
    matcher-note: "as capabilities alimentam o MATCHER (advisory): na triagem/breakdown ele SUGERE o repo de cada peça (score + porquê + unknown quando não sabe); o HUMANO confirma, e a sugestão fica registrada (followed/overrode). Capability sem evidência independente vira unknown — não entra com peso igual (lei do red-team B1)"
    contracts-note: "um contrato NASCE quando um repo publica uma interface que outros consomem (o owner o declara; consumidores se registram). MUDA por revisão — toda revisão passa pelo review do owner; revisão com QUEBRA abre a janela (versões convivem até os consumidores migrarem). CONSUMIR sem revisão não é mudança"
    contracts: # contratos vivos entre os repos (a janela de compatibilidade mora AQUI)
      - {
          id: "acme-user-context@v3",
          owner: acme-web-host,
          consumers: "mfe-billing · mfe-onboarding · checkout",
          note: "a migração do checkout abre a v4 → janela: v3 + v4 convivem",
        }
      - { id: "acme-design-tokens@v2", owner: acme-design-system, consumers: "todos os MFEs" }
      - {
          id: "acme-events-schema@v1",
          owner: acme-analytics,
          consumers: "mfes · checkout",
          note: "extensão COMPATÍVEL não acorda janela — touches-contract é sobre quebra/porte, não uso",
        }
    intents:
      - id: intent-cta-upgrade
        team: time-billing
        authorized-by: obj-revenue
        title: "CTA contextual de upgrade no billing"
        approach: validate-first
        signal: none
        contracts-consumed: ["acme-events-schema@v1"] # consome SEM revisão — não é sinal
        derived: "experiment-run — hipótese (CTA ↑ conversão em X%) + flag + métricas + guardrails; veredito: ganhou → graduation · perdeu → cleanup"
        works: # o desdobramento interno — as peças por repo (id · blocked-by · review DERIVADO)
          - {
              id: spike-elegibilidade,
              repo: acme-api-billing,
              purpose: discover,
              desc: "EXPLORATION — spike: dá p/ reusar o motor de elegibilidade que já existe? timebox 3 dias · pergunta falsificável · fate",
              review: "interno (repo do próprio time)",
            }
          - {
              id: api-elegibilidade,
              repo: acme-api-billing,
              purpose: create,
              desc: "elegibilidade + endpoint (o fate do spike decide: reusar × construir)",
              blocked-by: [spike-elegibilidade],
              review: "interno (repo do próprio time)",
            }
          - {
              id: ui-cta,
              repo: acme-mfe-billing,
              purpose: create,
              desc: "UI do CTA atrás da flag — constrói em PARALELO com mock; a INTEGRAÇÃO espera o endpoint",
              delivery-after: [api-elegibilidade],
              review: "interno (repo do próprio time)",
            }
          - {
              id: baseline-eventos,
              repo: acme-analytics,
              purpose: operate,
              desc: "instrumenta com o schema de eventos EXISTENTE — consome acme-events-schema@v1 SEM revisão (por isso o sinal da intent segue none); precisa estar pronto ANTES de ligar a flag (baseline)",
              review: "EXTERNO — time-data (peça roda no repo de outro time)",
            }
        next: # a ramificação da próxima etapa (o veredito decide; o humano só aceita)
          - {
              when: "veredito: ganhou",
              then: "graduation — efetiva a variante (a flag sai, o código fica); o outcome soma no placar do time-billing",
              gate: accept-verdict,
            }
          - {
              when: "veredito: perdeu",
              then: "cleanup — remove flag/variante; o aprendizado fica registrado no outcome (não soma capacidade)",
              gate: accept-verdict,
            }
          - {
              when: "veredito: inconclusivo",
              then: "novo experimento com hipótese refinada OU vira descoberta (a pergunta ficou maior que o teste)",
              gate: accept-verdict,
            }
      - id: intent-checkout-stack
        team: time-checkout
        authorized-by: obj-efficiency
        title: "migrar o checkout para o stack novo"
        approach: direct
        signal: touches-contract
        contracts-changed: ["acme-user-context@v3"] # muda COM quebra — abre a janela
        derived: "migration-wave — porta de → para em 3 repos; janela de compatibilidade do contrato acme-user-context; consumidores avisados; corte gradual → release-rollout"
        works: # o desdobramento interno — peças MISTAS sob a mesma onda (id · blocked-by · review DERIVADO)
          - {
              id: spike-carrinho,
              repo: acme-checkout,
              purpose: discover,
              desc: "EXPLORATION — spike: como migrar o estado do carrinho sem downtime? timebox · fate (informa a onda 1)",
              review: "interno (repo do próprio time)",
            }
          - {
              id: componentes-ds,
              repo: acme-design-system,
              purpose: create,
              desc: "componentes do checkout no stack novo (consome acme-design-tokens@v2 sem revisão)",
              review: "EXTERNO — area-platform (dona do design-system); combinar prazo com stakeholders",
            }
          - {
              id: porta-fluxo,
              repo: acme-checkout,
              purpose: sustain,
              desc: "porta o fluxo principal (de → para) usando os componentes novos",
              blocked-by: [spike-carrinho],
              delivery-after: [componentes-ds],
              review: "interno (repo do próprio time)",
            }
          - {
              id: adapta-api,
              repo: acme-checkout-api,
              purpose: sustain,
              desc: "adapta os endpoints ao stack novo",
              review: "interno (repo do próprio time)",
            }
          - {
              id: revisao-contrato,
              repo: acme-web-host,
              purpose: sustain,
              desc: "acme-user-context v3 → v4 COM QUEBRA — é AQUI que a janela abre; mutação compat-window-change (dangerous → alerta q/r/d)",
              review: "EXTERNO — owner do contrato (acme-web-host/area-platform) + consumidores avisados (mfe-billing · mfe-onboarding)",
            }
          - {
              id: monitor-canary,
              repo: acme-obs-stack,
              purpose: operate,
              desc: "monitor do canary (guardrails do corte)",
              delivery-after: [porta-fluxo, adapta-api],
              review: "EXTERNO — time-sre (peça roda no repo de outro time)",
            }
        next: # a ramificação da próxima etapa (a onda avança por marcos)
          - {
              when: "onda 1 concluída — fluxo principal portado",
              then: "janela de compatibilidade ABERTA: v1 e v2 convivem; os consumidores do contrato migram no seu ritmo",
            }
          - {
              when: "consumidores migrados",
              then: "corte gradual — release-rollout (canary) com plano de reversão",
              gate: release-rollout,
            }
          - {
              when: "corte completo",
              then: "fecha a janela, desliga o legado; o outcome sobe no placar 'reduzir o custo de servir'",
            }
      - id: intent-p99-hardening
        team: time-sre
        authorized-by: obj-efficiency
        title: "derrubar o p99 da plataforma (timeouts, retries, cache)"
        approach: direct
        signal: operational-target
        derived: "quase sempre COLAPSA — peças sustain (preventivo) e operate direto nos repos; o placar é OPERACIONAL (SLO p99, incidentes), não métrica de produto; guardrails no dashboard"
        works: # o desdobramento interno — sem unit: as peças penduram direto na intent (id · blocked-by · review)
          - {
              id: guardrails-p99,
              repo: acme-obs-stack,
              purpose: operate,
              desc: "guardrails de p99 + alertas — MEDIR ANTES de mexer (baseline); é a fonte que ATESTA os outcomes",
              review: "interno (repo do próprio time)",
            }
          - {
              id: timeouts-api,
              repo: acme-checkout-api,
              purpose: sustain,
              desc: "timeouts + retries (preventivo)",
              delivery-after: [guardrails-p99],
              review: "EXTERNO — time-checkout (o SRE mexe no repo de outro time)",
            }
          - {
              id: cache-contexto,
              repo: acme-web-host,
              purpose: sustain,
              desc: "cache do contexto de usuário (sem mudar o contrato — só a implementação)",
              delivery-after: [guardrails-p99],
              review: "EXTERNO — area-platform (dona do web-host)",
            }
        next: # a ramificação da próxima etapa (o placar operacional decide o rumo)
          - {
              when: "peças concluídas em cada repo",
              then: "outcomes sobem no placar OPERACIONAL — attester é a fonte de observabilidade (independente do time)",
            }
          - {
              when: "p99 cedeu",
              then: "guardrails viram monitoramento permanente (peças operate); a intent fecha",
            }
          - {
              when: "p99 NÃO cedeu",
              then: "escala: vira descoberta (investigar a causa) OU experimento de performance (validate-first — 'cache resolve?')",
            }
    standalone: # os caminhos SEM intent (reativo/avulso) — concretos na mesma acme
      - id: bug-frete
        origin: "suporte reporta: cupom duplo zera o frete"
        path: "matcher sugere acme-checkout (caps: cupom · frete) → peça sustain direto, preset fix (corrective + user-visible) — sem intent, sem abordagem: as camadas colapsam"
        review: "interno (time-checkout)"
        placar: "bucket operacional — visível, fora do rollup dos objetivos"
      - id: incidente-checkout
        origin: "alerta do acme-obs-stack às 22:14 — checkout fora do ar (severidade alta; telemetria verificável é PRÉ-CONDIÇÃO p/ declarar)"
        path: "incident-response nasce do ALERTA (reativo — nunca de abordagem): mitigar → resolver → postmortem blameless"
        review: "o postmortem gera follow-ups PLANEJADOS: fix (peça sustain) + proposta de hardening → entra no intake (com authorized-by ou standalone)"
        placar: "bucket operacional + MTTR — o custo do incidente aparece p/ os stakeholders"
      - id: dep-bump-host
        origin: "rotina: lib X 3.x → 4.x no acme-web-host"
        path: "peça sustain, preset dep-bump (adaptive + internal) — 1 nome só, zero cerimônia"
        review: "interno (area-platform)"
        placar: "bucket operacional (custo de manutenção visível)"
    dashboards: # o fim da cadeia — DERIVADOS do grafo (ninguém preenche à mão)
      execution: # acompanhamento dos times (peças · bloqueios · reviews · gates · alertas)
        - "intent-cta-upgrade: peças repo-local concluídas com evidência · outcome out-cta-upgrade-2027q1 publicado · resolver fecha fonte/revisão/janela/attester/envelope antes do dashboard somar"
        - "intent-checkout-stack: caminho crítico = componentes-ds (review externo area-platform) → porta-fluxo → monitor-canary · janela v3+v4 ABERTA (2 consumidores pendentes) · alerta q/r/d ativo na revisao-contrato (compat-window-change)"
        - "intent-p99-hardening: baseline PRIMEIRO (guardrails); 2 peças codificando em paralelo (não ligam antes do baseline); 2 reviews externos no caminho"
      stakeholders: # visão de negócio, por objetivo — só outcome VÁLIDO soma (resolver fail-closed)
        - "crescer receita via cross-sell: target +X% de conversão — actual +2.4% DERIVADO de outcome validado (fonte acme-analytics@warehouse-rev42; nada entra sem resolver)"
        - "reduzir o custo de servir: migração onda 1 em curso (janela aberta; progresso por consumidor) · p99 com baseline estabelecido — actuals DERIVADOS, attester independente (acme-obs-stack)"
        - "bucket operacional: 1 bug (frete) · 1 incidente (MTTR 43min; postmortem gerou 2 follow-ups) · 1 dep-bump — custo visível, fora do rollup dos objetivos"
        - "higiene: 0 dangerous-unreviewed em aberto · perfil full declarado (badge) · 0 números self-attested"
  artifact: "_map/flow-explorer.html (a JORNADA da org-exemplo, navegável em 5 etapas) + _map/flow-generic.html (as regras genéricas abordagem × sinais) — ambos gerados desta seção por _map/generate.mjs"

# ═════════════════════ DECISÕES FECHADAS E ABERTOS REAIS ═════════════════════
decisions:
  - {
      id: P1,
      about: "família do experiment",
      status: resolved,
      by: "3-layer: experiment = execution-unit (experiment-run)",
    }
  - {
      id: P2,
      about: "teste 'entrega valor?' ambíguo p/ maintenance",
      status: resolved,
      by: "3-layer: repo-work.purpose (create/sustain/discover/operate); dep-bump = sustain",
    }
  - {
      id: P3,
      about: "delivery ~ experiment > maintenance",
      status: resolved,
      by: "3-layer: delivery=create/direct; experiment=execution-unit; sustain à parte",
    }
  - { id: P4, about: "nomes EN/PT", status: decided, by: "ids EN + labels PT" }
  - {
      id: P5,
      about: "breakdown estreito",
      status: resolved,
      by: "3-layer: intent → execution-units → repo-works (heterogêneo)",
    }
  - {
      id: P6,
      about: "experimento é UM, cross-repo",
      status: resolved,
      by: "3-layer: a execution-unit é a unidade; peças por repo subordinadas",
    }
  - {
      id: P7,
      about: "redesign misto + contratos entre iniciativas",
      status: resolved,
      by: "3-layer: migration-wave com peças mistas; contrato compartilhado coordena",
    }
  - {
      id: Q-strategy,
      about: "intent.strategy é guardado ou DERIVADO das execution-units?",
      status: resolved,
      by: "P12 aplicado: strategy de 4 valores foi substituída por approach binário declarado (validate-first/direct) + signal derivado/confirmado; drift vira approach-drift/signal-drift",
    }
  - {
      id: Q-collapse,
      about: "regra exata de quando a execution-unit colapsa (trivial)",
      status: resolved,
      by: "owner 2026-07-01: a régua é a scaling-law — unit existe se >1 repo OU kind com lifecycle próprio (nunca colapsam) OU owner/cadência próprios; senão colapsa, REVERSÍVEL (reparent com envelope). Ver layers.execution-unit.collapse-rule",
    }
  - {
      id: Q-discover-level,
      about: "exploration grande (cross-repo) = discover repo-work × discovery execution-unit?",
      status: resolved,
      by: "discovery virou execution-unit quando a pergunta/fate é compartilhada cross-repo ou tem lifecycle/owner/cadência próprios; descoberta simples colapsa em repo-work purpose=discover",
    }
  - {
      id: Q-names,
      about: "nomes finais dos kinds/purposes (feature-slice? rollout-slice puxa peso?)",
      status: resolved,
      by: "feature-slice→delivery-slice · shape-up→graduation · rollout-slice→release-rollout · discovery adicionado; ids EN, labels/descrições PT",
    }
  - {
      id: P13,
      about: "adoção por empresa existente e fidelidade repo-first",
      status: applied,
      by: "org-simulation-v3: repos com código MVP + sidecars .governance + context.json + repo-work lifecycle + repo-contract registry com interface; host valida stale/missing/open/dropped com red-team fixtures R/RW/RC",
    }
  - {
      id: P14,
      about: "primeiro outcome real + controles físicos de confiança",
      status: applied,
      by: "org-simulation-v3: intent-cta-upgrade publica outcome governado; repo-work done exige evidência; trust-policy valida ACL local, fallback matcher/egress, revogação, nonce/idempotência, secret quarantine e independência do oráculo",
    }

open-questions: []
