# exploration.yml — TEMPLATE do índice (vira `registry/exploration.yml` num repo). Base: `registry-entry.yml` + os extras da exploration.
# A exploration é uma FERRAMENTA executada (Lente 4); mora em `.governance/explorations/` (FORA de works/). A registry é GOVERNANÇA; o conteúdo vive no exploration-brief/answer.
entries:
  - id: <slug>_<num> # slug + numérico embutido (sem prefixo de tipo); a pasta é explorations/<slug>_<num>/
    title: <curto>
    status: <draft | active | done> # nasce DRAFT; `active` exige assignee + início (a exploration NÃO fica "bloqueada" — um bloqueio que ela acha vira a RESPOSTA)
    assignee: <@quem | null> # quem ASSUMIU
    intent: <intent-id | null> # a intent dona (back-ref)

    # ===== a AMARRA (Lente 5): o que esta exploration RESPONDE =====
    answers: <repo>/intents/<intent-id>#<qN> # back-ref TIPADO → a intent DERIVA `answered-by` (A+, check anti-drift). Ancorada AQUI (anota-se 1 lado).

    workspace: explorations/<slug>_<num>/ # relativo a .governance/; quando densa (POC); o brief/answer vivem aí dentro

    # ===== fecho =====
    fate: <throwaway | promoted | parked> # destino do output (preenche no FECHO) ⇒ dispara por DERIVAÇÃO: a question resolve → o contrato destrava
    closed-by: <ref ao exploration-answer> # quando há fecho denso
    closed-at: <YYYY-MM-DD>

    created-at: <YYYY-MM-DD> # abertura
    updated-at: <YYYY-MM-DD>
    # demais arestas da base (blocked-by/depends-on/coordinates-with) são RARAS p/ exploration — ela não agenda; ver registry-entry.yml
