<svg viewBox="0 0 860 470" width="860" height="470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Spike: os 3 destinos da saída conforme tem casa ou foi priorizado agora</title>
  <desc>Um spike denso gera saídas. Conforme a pergunta "tem casa / priorizado agora?", cada saída segue um de tres caminhos: jogável morre num PR sem merge (só o aprendizado vai pro answer); durável com casa é promovido pro home, por exemplo _templates; valioso mas sem casa fica parqueado na pasta do spike e um proposal leve aponta pro backlog, e quando priorizado é promovido. O spike-answer indexa tudo.</desc>

  <defs>
    <style>
      svg { --text-primary:#0f172a; --text-secondary:#475569; --text-muted:#94a3b8; --surface-0:#f8fafc; --surface-1:#ffffff; --surface-2:#eff6ff; --border-strong:#cbd5e1; --text-accent:#2563eb; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-muted)"/></marker>
    <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-accent)"/></marker>
  </defs>

  <rect x="0" y="0" width="860" height="470" fill="#ffffff"/>

  <text x="20" y="28" font-size="15" font-weight="700" fill="var(--text-primary)">Spike — os 3 destinos da saída (depende: tem casa / priorizado agora?)</text>

  <rect x="20" y="45" width="14" height="14" rx="3" fill="var(--surface-2)" stroke="var(--text-accent)" stroke-width="2"/>
  <text x="40" y="56" font-size="11" fill="var(--text-secondary)">durável (fica)</text>
  <rect x="150" y="45" width="14" height="14" rx="3" fill="var(--surface-1)" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="170" y="56" font-size="11" fill="var(--text-secondary)">descartável (morre)</text>

  <rect x="20" y="150" width="180" height="150" rx="10" fill="var(--surface-0)" stroke="var(--border-strong)"/>
  <text x="34" y="178" font-size="13" font-weight="700" fill="var(--text-primary)">📁 SPIKE (denso)</text>
  <text x="34" y="198" font-size="11" fill="var(--text-secondary)">intent-brief.md</text>
  <text x="34" y="213" font-size="10" fill="var(--text-muted)">(kind: spike)</text>
  <text x="34" y="240" font-size="11" fill="var(--text-secondary)">saídas geradas:</text>
  <text x="34" y="256" font-size="10" fill="var(--text-muted)">PoC · rascunhos</text>
  <text x="34" y="270" font-size="10" fill="var(--text-muted)">· descobertas</text>

  <text x="206" y="142" font-size="10.5" fill="var(--text-muted)">tem casa / priorizado agora?</text>

  <line x1="200" y1="200" x2="296" y2="123" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <text x="232" y="158" font-size="10.5" fill="var(--text-muted)">jogável</text>
  <line x1="200" y1="225" x2="296" y2="225" stroke="var(--text-accent)" stroke-width="1.6" marker-end="url(#ahA)"/>
  <text x="228" y="218" font-size="10.5" fill="var(--text-accent)">tem casa</text>
  <line x1="200" y1="250" x2="296" y2="330" stroke="var(--text-accent)" stroke-width="1.6" marker-end="url(#ahA)"/>
  <text x="214" y="300" font-size="10.5" fill="var(--text-accent)">sem casa (vale)</text>

  <rect x="300" y="96" width="232" height="54" rx="8" fill="var(--surface-1)" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="316" y="120" font-size="12.5" font-weight="700" fill="var(--text-muted)">🗑️ jogável → morre</text>
  <text x="316" y="138" font-size="10.5" fill="var(--text-muted)">PR fechado sem merge · aprendizado → answer</text>

  <rect x="300" y="198" width="232" height="54" rx="8" fill="var(--surface-2)" stroke="var(--text-accent)" stroke-width="2"/>
  <text x="316" y="222" font-size="12.5" font-weight="700" fill="var(--text-primary)">📁 _templates/ (home)</text>
  <text x="316" y="240" font-size="10.5" fill="var(--text-secondary)">promove · answer indexa</text>

  <rect x="300" y="300" width="210" height="60" rx="8" fill="var(--surface-2)" stroke="var(--text-accent)" stroke-width="2"/>
  <text x="314" y="324" font-size="12.5" font-weight="700" fill="var(--text-primary)">🧊 parqueado</text>
  <text x="314" y="342" font-size="10.5" fill="var(--text-secondary)">fica na pasta do spike</text>
  <text x="314" y="354" font-size="9.5" fill="var(--text-muted)">(valor não se rascunha)</text>

  <line x1="510" y1="330" x2="556" y2="330" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="560" y="302" width="146" height="56" rx="8" fill="var(--surface-1)" stroke="var(--border-strong)"/>
  <text x="573" y="326" font-size="11.5" font-weight="700" fill="var(--text-primary)">🗳️ proposal (leve)</text>
  <text x="573" y="343" font-size="10.5" fill="var(--text-secondary)">aponta → backlog</text>

  <line x1="706" y1="330" x2="728" y2="330" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <rect x="730" y="302" width="122" height="56" rx="8" fill="var(--surface-2)" stroke="var(--text-accent)" stroke-width="2"/>
  <text x="742" y="324" font-size="11" font-weight="700" fill="var(--text-primary)">priorizou?</text>
  <text x="742" y="341" font-size="10" fill="var(--text-secondary)">promove (descongela)</text>

  <rect x="20" y="396" width="832" height="54" rx="8" fill="var(--surface-0)" stroke="var(--border-strong)"/>
  <text x="34" y="419" font-size="12.5" font-weight="700" fill="var(--text-primary)">📄 spike-answer.md — o registro / índice (sempre)</text>
  <text x="34" y="438" font-size="10.5" fill="var(--text-secondary)">resposta + descobertas + onde cada saída foi parar (link pro home · pra pasta parqueada · pro proposal)</text>
</svg>
