<svg viewBox="0 0 860 380" width="860" height="380" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Lente 2 — ciclo de vida por tipo (5 momentos), com cores de enforcement e documentos</title>
  <desc>Tabela. Linhas: delivery, experiment, spike, incident, fix, patch. Colunas (momentos): abrir, investigar/decidir (o coração), executar, entregar, acompanhar. Vermelho = obrigatório (o framework reclamaria se faltar), amarelo = opcional, cinza = pula. abrir = o &lt;kind&gt;-brief (vermelho). investigar/decidir = question·research·decision (amarelo, opcional, é o coração). executar = fazer (vermelho). entregar = merge na maioria; spike entrega o spike-answer; incident merge com bypass. acompanhar: experiment = experiment-outcome e incident = incident-postmortem (vermelho), delivery/fix/patch = verificar (amarelo), spike = pula (terminal).</desc>

  <rect x="0" y="0" width="860" height="380" fill="#ffffff" />
  <text x="14" y="26" font-size="15" font-weight="700" fill="#0f172a">Lente 2 — ciclo de vida por tipo (5 momentos)</text>

  <rect x="14" y="38" width="13" height="13" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
  <text x="32" y="49" font-size="11" fill="#475569">obrigatório</text>
  <rect x="120" y="38" width="13" height="13" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  <text x="138" y="49" font-size="11" fill="#475569">opcional</text>
  <rect x="210" y="38" width="13" height="13" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="228" y="49" font-size="11" fill="#475569">pula</text>
  <text x="270" y="49" font-size="11" fill="#94a3b8">✦ investigar/decidir = coração (question·research·decision)</text>

  <rect x="14" y="62" width="838" height="28" rx="4" fill="#f1f5f9" />
  <g font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="172" y="80">abrir</text>
    <text x="332" y="80">investigar/decidir ✦</text>
    <text x="480" y="80">executar</text>
    <text x="610" y="80">entregar</text>
    <text x="771" y="80">acompanhar</text>
  </g>

  <g font-size="12" font-weight="700" fill="#0f172a">
    <text x="20" y="126">delivery</text>
    <text x="20" y="168">experiment</text>
    <text x="20" y="210">spike</text>
    <text x="20" y="252">incident</text>
    <text x="20" y="294">fix</text>
    <text x="20" y="336">patch</text>
  </g>

  <g text-anchor="middle" font-size="9.5">
    <!-- delivery -->
    <rect x="113" y="104" width="119" height="38" rx="5" fill="#fee2e2" /><text x="172" y="127" fill="#b91c1c" font-weight="600">delivery-brief</text>
    <rect x="238" y="104" width="189" height="38" rx="5" fill="#fef3c7" /><text x="332" y="127" fill="#92400e" font-weight="600">question·research·decision</text>
    <rect x="433" y="104" width="94" height="38" rx="5" fill="#fee2e2" /><text x="480" y="127" fill="#b91c1c" font-style="italic">fazer</text>
    <rect x="533" y="104" width="154" height="38" rx="5" fill="#fee2e2" /><text x="610" y="127" fill="#b91c1c" font-style="italic">merge</text>
    <rect x="693" y="104" width="156" height="38" rx="5" fill="#fef3c7" /><text x="771" y="127" fill="#92400e" font-style="italic">verificar</text>
    <!-- experiment -->
    <rect x="113" y="146" width="119" height="38" rx="5" fill="#fee2e2" /><text x="172" y="169" fill="#b91c1c" font-weight="600">experiment-brief</text>
    <rect x="238" y="146" width="189" height="38" rx="5" fill="#fef3c7" /><text x="332" y="169" fill="#92400e" font-weight="600">question·research·decision</text>
    <rect x="433" y="146" width="94" height="38" rx="5" fill="#fee2e2" /><text x="480" y="169" fill="#b91c1c" font-style="italic">fazer</text>
    <rect x="533" y="146" width="154" height="38" rx="5" fill="#fee2e2" /><text x="610" y="169" fill="#b91c1c" font-style="italic">merge</text>
    <rect x="693" y="146" width="156" height="38" rx="5" fill="#fee2e2" /><text x="771" y="169" fill="#b91c1c" font-weight="600">experiment-outcome</text>
    <!-- spike -->
    <rect x="113" y="188" width="119" height="38" rx="5" fill="#fee2e2" /><text x="172" y="211" fill="#b91c1c" font-weight="600">spike-brief</text>
    <rect x="238" y="188" width="189" height="38" rx="5" fill="#fef3c7" /><text x="332" y="211" fill="#92400e" font-weight="600">question·research·decision</text>
    <rect x="433" y="188" width="94" height="38" rx="5" fill="#fee2e2" /><text x="480" y="211" fill="#b91c1c" font-style="italic">fazer</text>
    <rect x="533" y="188" width="154" height="38" rx="5" fill="#fee2e2" /><text x="610" y="211" fill="#b91c1c" font-weight="600">spike-answer</text>
    <rect x="693" y="188" width="156" height="38" rx="5" fill="#f1f5f9" /><text x="771" y="212" fill="#94a3b8" font-size="13">—</text>
    <!-- incident -->
    <rect x="113" y="230" width="119" height="38" rx="5" fill="#fee2e2" /><text x="172" y="253" fill="#b91c1c" font-weight="600">incident-brief</text>
    <rect x="238" y="230" width="189" height="38" rx="5" fill="#fef3c7" /><text x="332" y="253" fill="#92400e" font-weight="600">question·research·decision</text>
    <rect x="433" y="230" width="94" height="38" rx="5" fill="#fee2e2" /><text x="480" y="253" fill="#b91c1c" font-style="italic">fazer</text>
    <rect x="533" y="230" width="154" height="38" rx="5" fill="#fee2e2" /><text x="610" y="253" fill="#b91c1c" font-style="italic">merge (bypass)</text>
    <rect x="693" y="230" width="156" height="38" rx="5" fill="#fee2e2" /><text x="771" y="253" fill="#b91c1c" font-weight="600">incident-postmortem</text>
    <!-- fix -->
    <rect x="113" y="272" width="119" height="38" rx="5" fill="#fee2e2" /><text x="172" y="295" fill="#b91c1c" font-weight="600">fix-brief</text>
    <rect x="238" y="272" width="189" height="38" rx="5" fill="#fef3c7" /><text x="332" y="295" fill="#92400e" font-weight="600">question·research·decision</text>
    <rect x="433" y="272" width="94" height="38" rx="5" fill="#fee2e2" /><text x="480" y="295" fill="#b91c1c" font-style="italic">fazer</text>
    <rect x="533" y="272" width="154" height="38" rx="5" fill="#fee2e2" /><text x="610" y="295" fill="#b91c1c" font-style="italic">merge</text>
    <rect x="693" y="272" width="156" height="38" rx="5" fill="#fef3c7" /><text x="771" y="295" fill="#92400e" font-style="italic">verificar</text>
    <!-- patch -->
    <rect x="113" y="314" width="119" height="38" rx="5" fill="#fee2e2" /><text x="172" y="337" fill="#b91c1c" font-weight="600">patch-brief</text>
    <rect x="238" y="314" width="189" height="38" rx="5" fill="#fef3c7" /><text x="332" y="337" fill="#92400e" font-weight="600">question·research·decision</text>
    <rect x="433" y="314" width="94" height="38" rx="5" fill="#fee2e2" /><text x="480" y="337" fill="#b91c1c" font-style="italic">fazer</text>
    <rect x="533" y="314" width="154" height="38" rx="5" fill="#fee2e2" /><text x="610" y="337" fill="#b91c1c" font-style="italic">merge</text>
    <rect x="693" y="314" width="156" height="38" rx="5" fill="#fef3c7" /><text x="771" y="337" fill="#92400e" font-style="italic">verificar</text>
  </g>

  <text x="14" y="370" font-size="9.5" fill="#94a3b8">nomes = documento · _itálico_ = ação (executar/entregar = fazer/merge; output varia: código, doc, config, dados). spike é terminal (sem acompanhar).</text>
</svg>
