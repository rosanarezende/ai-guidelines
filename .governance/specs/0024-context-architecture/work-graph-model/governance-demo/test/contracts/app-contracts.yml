version: 2
status: active
updated: 2026-07-05
purpose: >
  Contratos funcionais da governance-demo. Este arquivo descreve o produto-alvo, nao apenas o que o
  app entrega hoje. Cada tela/fluxo/feature deve ter teste Playwright correspondente antes da
  implementacao ou refactor. Contratos podem nascer fixme/expected-fail, mas nao podem nascer sem
  ID, seed, superficies e criterios observaveis.
conventions:
  status:
    active: executa e deve passar
    expected-fail: executa e deve falhar ate a implementacao corrigir
    fixme: nao executa porque rota/infra ainda falta ou travaria
    skip: nao aplicavel a uma configuracao especifica
    manual: validacao humana temporaria com plano para automatizar
  test_shape:
    - Todo contrato deve ter spec Playwright, mesmo que test.fixme.
    - O corpo do teste deve conter passos/assertions alvo, nao placeholder vazio.
    - Design/copy podem mudar; behavior, persistencia, authority e consistencia nao.
    - Fluxo que cruza telas precisa provar origem, destino e reload quando aplicavel.
  selector_policy:
    - Preferir data-testid semantico para comportamento estavel.
    - Usar getByRole/getByLabel quando o texto e parte do contrato de entendimento.
    - Nao usar classes MUI, ordem visual, DOM interno ou seletores CSS frageis.
  evidence:
    - Todo contrato ativo deve produzir trace em falha.
    - Todo contrato cross-screen deve provar que o mesmo dado aparece coerente nas telas declaradas.
    - Todo contrato de seguranca deve provar block/warn/fail-visible, nao apenas copy.
seed_matrix:
  blank: sem principal, sem workspace
  empty-workspace: principal local + workspace novo sem onboarding
  onboarding-partial: workspace com onboarding parcial
  workspace-sem-host: workspace sem governance host
  workspace-host-local: workspace com governance host local
  workspace-host-embutido: workspace com .governance-host embutido
  workspace-local: workspace solo/local
  workspace-shared: workspace compartilhado
  workspace-controlled: workspace controlado/security
  workspace-controlled-neo4j: workspace controlado com Neo4j read-model
  workspace-docker-compose: workspace com stack compose
  workspace-docker-ollama-profile: workspace com profile Ollama local
  workspace-groups-teams: workspace com pessoas/times/grupos
  workspace-authority-personas: workspace com principals distintos para personas/authority
  workspace-shared-convites: workspace com convites pendentes
  workspace-shared-github: workspace com GitHub identity provider
  workspace-shared-google: workspace com Google/OIDC
  workspace-controlled-oidc: workspace controlled com OIDC generico
  workspace-cloud-synced-folder: fonte local sincronizada em nuvem
  workspace-provider-versioned-source: fonte versionada por provider
  workspace-compact-policy: perfil compact com policy de acumulacao
  workspace-multi-assistant: multiplos assistentes/defaults
  workspace-with-integration-statuses: integrações configuradas, desabilitadas e fontes mistas
  workspace-planning-progressivo: planejamento progressivo
  workspace-github-work-source: GitHub como work-source release-1
  acme-demo: snapshot demo acme anexado explicitamente
