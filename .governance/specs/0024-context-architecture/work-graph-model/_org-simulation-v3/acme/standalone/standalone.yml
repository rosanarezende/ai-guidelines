# standalone.yml — os caminhos SEM intent (reativo/avulso): as camadas colapsam; nada some do placar.
standalone:
  - id: bug-frete
    kind: fix # preset: sustain + corrective + user-visible
    repo: acme-checkout
    origin: "suporte reporta: cupom duplo zera o frete"
    routing:
      matcher: local-capability-matcher
      query: "cupom duplo zera frete"
      selected-repo: acme-checkout
      decision: followed
      decided-by: lead-checkout
      suggestions:
        - repo: acme-checkout
          score: 0.91
          unknown: false
          evidence: ["cap:cupom", "cap:frete", "owner:time-checkout"]
        - repo: acme-checkout-api
          score: 0.44
          unknown: true
          evidence: []
    review: interno
    placar: operational-bucket
  - id: incidente-checkout
    kind: incident-response # reativo — nasce de ALERTA com telemetria verificável, nunca de abordagem
    repo: acme-checkout-api
    origin: "alerta do acme-obs-stack às 22:14 — checkout fora do ar (sev alta)"
    severity: alta
    mttr: 43min
    postmortem: blameless
    follow-ups:
      - ref: standalone:fix-checkout-timeout
        kind: fix
        reason: "ajustar timeouts que agravaram a mitigação"
      - ref: proposal:prop-checkout-hardening
        kind: proposal
        reason: "avaliar hardening planejado pós-postmortem"
    placar: "operational-bucket + MTTR"
  - id: fix-checkout-timeout
    kind: fix # follow-up resolvível do incidente-checkout
    repo: acme-checkout-api
    origin: "follow-up de standalone:incidente-checkout — reduzir timeout e fallback do checkout"
    review: interno
    placar: operational-bucket
  - id: dep-bump-host
    kind: dep-bump # preset: sustain + adaptive + internal
    repo: acme-web-host
    origin: "rotina: lib X 3.x → 4.x"
    review: "externo: area-platform"
    placar: operational-bucket
