# TEMPLATE contract — nasce quando um repo publica interface que outros consomem.
# Toda revisão passa pelo review do owner; revisão com QUEBRA abre a janela (que mora AQUI).
id: <contrato-slug>
revision: v1
owner-repo: <repo que publica>
consumers: [<repos que consomem>]
compatibility-window: null # "vN + vN+1 até <data>" quando uma quebra abrir a janela
# Se >1 intent muda o mesmo contrato, uma revision-proposal com decision deixa de ser opcional.
# revision-proposals:
#   - id: <contrato>-v<N>
#     revision: v<N>
#     breaking: true
#     intents: [<intent-a>, <intent-b>]
#     consumers: [<repos afetados>]
#     owner-approval: <authority do owner-repo>
#     decision: single-revision # single-revision | sequenced-windows | split | rejected | pending
#     compatibility-window: "<janela ou plano de compatibilidade>"
