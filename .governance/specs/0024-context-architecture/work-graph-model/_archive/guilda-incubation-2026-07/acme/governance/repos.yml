# repos.yml — o terreno: 12 repos. DONO é sempre UM (invariante de accountability — quem responde);
# "vários times mexem no mesmo repo" aparece nas PEÇAS das intents (com review externo derivado).
repos:
  - { id: acme-mfe-billing, owner: time-billing, caps: [billing-ui, planos, upgrade] }
  - { id: acme-api-billing, owner: time-billing, caps: [cobrança, elegibilidade, assinaturas] }
  - { id: acme-mfe-onboarding, owner: time-onboarding, caps: [onboarding, ativação, tours] }
  - { id: acme-checkout, owner: time-checkout, caps: [checkout-ui, carrinho, cupom, frete] }
  - { id: acme-checkout-api, owner: time-checkout, caps: [pedidos, pagamento, frete-api] }
  - { id: acme-analytics, owner: time-data, caps: [eventos, métricas, experimentos-fonte] }
  - { id: acme-data-pipeline, owner: time-data, caps: [etl, warehouse] }
  - { id: acme-obs-stack, owner: time-sre, caps: [alertas, slo, tracing, atesta-outcomes] }
  - { id: acme-identity, owner: time-identity, caps: [auth, login, consentimento, privacidade] }
  - { id: acme-help-center, owner: time-support, caps: [ajuda, tickets, chatbot, self-service] }
  - {
      id: acme-web-host,
      owner: area-platform,
      caps: [shell-mfes, contexto-de-usuario, roteamento],
      note: compartilhado,
    }
  - {
      id: acme-design-system,
      owner: area-platform,
      caps: [componentes, tokens],
      note: compartilhado,
    }
  - id: acme-core-api
    owner: area-platform # CUSTODIÃO do repo: build, CI e o que não é de módulo nenhum
    caps: [api-legada, integracoes]
    note: "MONOLITO legado — grande demais p/ um time só: donos por MÓDULO (padrão CODEOWNERS)"
    modules:
      - { id: mod-billing, owner: time-billing, caps: [cobranca-legada, notas-fiscais] }
      - { id: mod-orders, owner: time-checkout, caps: [pedidos-legados, estoque] }
      - { id: mod-accounts, owner: time-identity, caps: [contas, permissoes-legadas] }
      - { id: mod-reports, owner: time-data, caps: [relatorios-legados] }
