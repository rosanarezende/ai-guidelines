# targets.yml — target = binding métrica × nó × período × valor. actual é DERIVADO (só de outcome válido).
# SoD da medição: definer ≠ attester (o attester é a FONTE independente, ver measurement-roles no model.yml).
targets:
  - id: tgt-billing-conv
    node: time-billing
    metric: conversion-rate
    period: 2027-H1
    expected: "+X% de conversão de cross-sell"
    definer: pm-growth
    attester: acme-analytics
    contributes-to: obj-revenue
    status: active
  - id: tgt-onboarding-act
    node: time-onboarding
    metric: activation-rate
    period: 2027-H1
    expected: "+Y% de ativação"
    definer: pm-growth
    attester: acme-analytics
    contributes-to: obj-revenue
    status: active
  - id: tgt-checkout-stack
    node: time-checkout
    metric: cost-to-serve
    period: 2027-H2
    expected: "checkout no stack novo até o fim do H2 (-W% de custo)"
    definer: head-platform
    attester: acme-data-pipeline
    contributes-to: obj-efficiency
    status: active
  - id: tgt-data-cost
    node: time-data
    metric: cost-to-serve
    period: 2027-H1
    expected: "-Z% no custo da infra de dados"
    definer: head-platform
    attester: acme-data-pipeline
    contributes-to: obj-efficiency
    status: active
    attestation-collapse:
      reason: "time-data mede a propria fonte operacional (acme-data-pipeline); trocar a fonte seria artificial nesta sim"
      approved-by: sponsor-acme
      review-at: 2027-01-15
      visibility: dashboard-badge
  - id: tgt-sre-p99
    node: time-sre
    metric: p99-latency
    period: 2027-H1
    expected: "p99 abaixo de N ms"
    definer: head-platform
    attester: acme-obs-stack
    contributes-to: obj-efficiency
    status: active
    attestation-collapse:
      reason: "time-sre atesta SLO pela propria stack de observabilidade; independencia externa seria antieconomica nesta sim"
      approved-by: sponsor-acme
      review-at: 2027-01-15
      visibility: dashboard-badge
  - id: tgt-sre-incidents
    node: time-sre
    metric: incident-count
    period: 2027-H1
    expected: "-30% de incidentes"
    definer: head-platform
    attester: acme-obs-stack
    contributes-to: obj-efficiency
    status: active
    attestation-collapse:
      reason: "time-sre atesta incidentes pela propria stack de observabilidade; colapso e intencional e visivel"
      approved-by: sponsor-acme
      review-at: 2027-01-15
      visibility: dashboard-badge
  - id: tgt-checkout-conv # growth como CULTURA: meta de RECEITA num time de PLATAFORMA
    node: time-checkout
    metric: conversion-rate
    period: 2027-H1
    expected: "+V% de conversão no checkout (1 clique)"
    definer: pm-growth
    attester: acme-analytics
    contributes-to: obj-revenue
    status: active
  - id: tgt-onboarding-churn # área de growth servindo obj-retention (área N:N)
    node: time-onboarding
    metric: churn-rate
    period: 2027-H1
    expected: "-P p.p. de churn nos ativados na 1ª semana"
    definer: pm-growth
    attester: acme-analytics
    contributes-to: obj-retention
    status: active
  - id: tgt-support-churn
    node: time-support
    metric: churn-rate
    period: 2027-H1
    expected: "-Q p.p. de churn entre quem abre ticket"
    definer: head-cx
    attester: acme-analytics
    contributes-to: obj-retention
    status: active
  - id: tgt-support-cost # área de CX servindo obj-efficiency (área N:N)
    node: time-support
    metric: ticket-cost
    period: 2027-H2
    expected: "-R% no custo por ticket via autoatendimento"
    definer: head-cx
    attester: acme-data-pipeline
    contributes-to: obj-efficiency
    status: active
  - id: tgt-identity-consent
    node: time-identity
    metric: consent-coverage
    period: 2027-H1
    expected: "100% dos dados com base legal registrada"
    definer: head-platform
    attester: acme-data-pipeline
    contributes-to: obj-trust
    status: active
