    subject: "o design system tem um formulário validado (email/site/telefone), ou cada MFE reimplementa?"
  - id: e2
    subject: "suporte proativo é viável? (detectar N falhas de login por pub/sub e abordar o usuário)"
  - id: e3
    subject: "captcha/anti-bot no login: o design system provê um componente, ou usamos serviço externo?"

# ===== contratos que a feature coordena (INPUT — a declaração); known/pending é DERIVADO (sem baldes) =====
