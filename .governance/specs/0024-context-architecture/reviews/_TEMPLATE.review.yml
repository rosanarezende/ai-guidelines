# Artefato de REVISÃO (Checkpoint 2.4a). Copie para `c<checkpoint>-<role>.yml`.
# Reviewer-owned. `disposition` é o ÚNICO campo que o gate lê e que muda (open ->
# accepted/dismissed). A CLAIM (severity/location/description) é selada por
# `fingerprint`; editá-la sem re-selar → `review:check` vermelho.
# Dica: deixe `fingerprint: x` e rode `yarn review:check` — ele imprime o esperado.
checkpoint: "3"
role: technical_audit # technical_audit | architectural_review
actor: codex-cli
decision: changes_requested # approved | changes_requested | blocked
findings_emitted: 1 # = nº de findings abaixo (anti-deleção)
findings:
  - id: F1 # contíguo: F1, F2, F3…
    severity: high # critical | high | medium | low
    location: "src/x.ts#L10-L20" # "<path>#L<a>-<b>" OU "global" (arquitetural) — obrigatório
    description: "o achado em uma linha"
    disposition: open # open | accepted | dismissed — SÓ o reviewer fecha
    fingerprint: x # sha256(id|severity|location|description)[:12]; `review:check` valida
