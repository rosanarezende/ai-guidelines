# Artefato de REVISÃO (Checkpoint 2.4a; evidência de cobertura 2.4e).
# Copie para `c<checkpoint>-<role>.yml`. Reviewer-owned.
#
# PROVENIÊNCIA: `role` = a LANE (technical_audit | architectural_review).
# `actor` = o EXECUTOR REAL da auditoria (ex.: gemini-3-pro-high | codex-cli |
# gpt-oss-...). NÃO assuma um default — registre quem de fato rodou.
#
# `disposition` é o ÚNICO campo que o gate lê e que muda (open -> accepted/dismissed).
# A CLAIM (severity/location/description) é selada por `fingerprint`; editá-la sem
# re-selar → `review:check` vermelho.
# Dica: deixe `fingerprint: x` / `review_fingerprint: x` e rode `yarn review:check`
# — ele imprime os hashes esperados.
checkpoint: "3"
role: technical_audit # technical_audit | architectural_review (a LANE)
actor: "<executor real: gemini-3-pro-high | codex-cli | gpt-oss-...>"
decision: changes_requested # approved | changes_requested | blocked
findings_emitted: 1 # = nº de findings abaixo (anti-deleção)
review_fingerprint: x # sela o CONJUNTO (checkpoint|role|count|ids[|audit_evidence]) — `review:check` valida
findings:
  - id: F1 # contíguo: F1, F2, F3…
    severity: high # critical | high | medium | low
    location: "src/x.ts#L10-L20" # "<path>#L<a>-<b>" OU "global" (arquitetural) — obrigatório
    description: "o achado em uma linha"
    disposition: open # open | accepted | dismissed — SÓ o reviewer fecha
    fingerprint: x # sha256(checkpoint|role|id|severity|location|description)[:12]; `review:check` valida
#
# ── APROVAÇÃO LIMPA (findings_emitted: 0) ──────────────────────────────────────
# A evidência NÃO são os findings (não há) → `audit_evidence` é OBRIGATÓRIA e
# SELADA no review_fingerprint. Estruturada (scope + basis), não narrativa.
# PROIBIDA quando há findings. Recuperabilidade: meses depois, só pelo YAML,
# responde "o que foi auditado / por que aprovou". Forma:
#
# checkpoint: "3"
# role: technical_audit
# actor: "gemini-3-pro-high"
# decision: approved
# findings_emitted: 0
# audit_evidence:
#   scope: "o que foi inspecionado — áreas/invariantes; pode referenciar o dossiê"
#   basis: "por que aprovou — incl. riscos ponderados; sem issue impeditiva"
# review_fingerprint: x # rode `yarn review:check` para o hash (inclui audit_evidence)
