# registry-entry.yml — schema de UMA entrada do índice per-kind `registry/<kind>.yml` (→ active-work).
# É ÍNDICE (projeção), NÃO a abertura: todo trabalho abre com um `<kind>-brief` E ganha uma entrada aqui.
id: <kind-prefix>-NNN # deliv | exp | spike | inc | patch | fix
kind: <delivery | experiment | spike | incident | fix | patch>
title: <curto>
status: <draft | active | closed | done> # ⚠️ o vocabulário de status POR KIND ainda não está definido (iterar)
workspace: works/<kind>_<slug>/ # só quando a densidade pede artefatos próprios; senão, omitir
# arestas (opcionais):
promotes-to: <id>
coordinates-with: <repo/id>
spawned-by: <id>
date: <YYYY-MM-DD>
