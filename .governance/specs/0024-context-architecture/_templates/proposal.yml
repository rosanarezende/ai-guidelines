# proposal.yml — a FERRAMENTA de intake (não é um tipo). Captura ideia/problema → triagem → backlog.
id: prop-NNN
what: "<a ideia ou problema — 1-2 linhas>"
raised-by: <trabalho/tarefa onde surgiu>
owner: <@quem tria>
status: <aberta | promovida | descartada> # disposição obrigatória (não fica aberta em silêncio)
promote-to: <delivery | experiment | spike | patch | fix | —> # se promovida, vira esse tipo
discard-reason: "<se descartada, por quê>"
date: <YYYY-MM-DD>
# ⚠️ onde isto vive (registry dedicado) e COMO alimenta o roadmap/backlog ainda está aberto (frente conectar intake↔backlog)
