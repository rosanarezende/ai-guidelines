# intent — plano do objetivo durável (meta-repo / governança global). Explicações: no tracker work-graph-model.
node: intent
sealed: false # intent é viva (não sela)

created-at: 2026-NN-NN
updated-at: 2026-NN-NN # última mutação (status/decisões/works); só nós MUTÁVEIS — append-only não atualiza
closed-at: # só quando terminal (done | dropped); vazio em active/paused

id: intent-NNN
title: <título curto>

# active=em andamento · paused=pausada por repriorização (retomável) · done=objetivo atingido · dropped=descartada por decisão (terminal)
status: # active | paused | done | dropped
owner: # quem TOCA a iniciativa (a dona) — papel ou pessoa

objective:
  goal: # a mudança / resultado durável que se quer no mundo
  success-signal: # o sinal de que o objetivo foi atingido
  out-of-scope: # o que esta intent NÃO persegue

references: # type: modeling | spec | design | benchmark | dashboard | alignment | other
  - type: modeling
    label: "<doc>"
    url: "<link>"
    note: "<nuance que sobrevive ao link>"

target-repos: # repos tocados (≠ breaks-into)
  - <repo>

# o APRENDIZADO da intent: cada incerteza → 1 exploration a responde (a exploration DECLARA `answers: intent#qN`).
# Aqui fica só o INPUT (id + question). Quem responde / status / verdict / resolvido = DERIVADO → projetado no BANCO, não no arquivo.
open-questions:
  - id: q1
    question: "<incerteza — texto IDÊNTICO ao `question` do exploration-brief>"

# contratos que a feature coordena — UMA lista; o status known/pending é DERIVADO (sem baldes):
#   sem `awaits` = known no t0 · com `awaits: qN` = known quando a question resolve (→ destrava as deliveries).
contracts:
  - { name: <contrato-t0> } # known no t0 → as deliveries já trabalham contra (via coordinates-with)
  - { name: <contrato>, awaits: q1 } # pending até q1 resolver; aí known (DERIVADO)

# breaks-into NÃO mora no arquivo — é VISTA DERIVADA (os works por status); o BANCO projeta o plano + caminho crítico.

# opcional: texto livre — síntese do aprendizado da intent como um todo, o porquê do status/dropped, etc.
details: |
  <prosa livre multi-linha, se necessário>
