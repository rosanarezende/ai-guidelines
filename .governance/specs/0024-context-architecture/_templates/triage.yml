# triage — a TRIAGEM (face de ENGENHARIA) da candidata. Vive ao lado do register.yml.
# A eng dispõe cada dúvida do negócio, roda o matcher e valida os contratos. Shape: D7/D8/D9 da deliberação 2026-06-30.
node: triage
updated-at: 2026-NN-NN

# itens a investigar/decidir: cada um vem de uma dúvida do NEGÓCIO (from-doubt) OU é levantado pela ENG na triagem.
items:
  - id: <rand> # chave própria do item
    title: "<o que investigar/decidir>"
    from-doubt: <open-question-id> # opcional: a dúvida de negócio de origem (ausente = levantado pela eng na fase)
    disposition: exploration # exploration | answered | needs-info
    # se exploration → o explore-point refinado (vira a exploration, DISPARADA no repo de trabalho):
    explore-point:
      {
        id: <rand>,
        title: "<o que investigar>",
        details: "<o que a exploration precisa responder>",
      }
    # se answered → a resposta direta do eng (não precisa investigar):
    # answer: "<resposta>"
    # se needs-info → volta pro NEGÓCIO: quem responde + desde quando (o read-model mede o tempo bloqueado, D8):
    # assignee: "@quem-de-negocio"
    # blocked-since: 2026-NN-NN

# CONTRATOS que a iniciativa coordena = pontos de INTERFACE compartilhados entre repos (componente / api / evento /
# serviço). Ex.: `form-component` (provido pelo design-system, consumido pelos MFEs). O `name` casa com um `provides`
# de algum manifesto. A eng VALIDA aqui (após o matcher): aceita / corrige / adiciona / remove.
contracts:
  - { name: <contrato>, awaits: <explore-id> } # awaits opcional: o explore-point que precisa resolver p/ ficar known

viability:
  | # notas de viabilidade (a investigação pode mostrar que a intent é INVIÁVEL → descartar no gate)
  <avaliação ao longo da investigação>
