# state.yml — progresso/topologia do trabalho (mutado por comando, não à mão).
work: <id-do-trabalho>
kind: <delivery | experiment | spike | incident | fix | patch>
stage: <deciding | executing> # ⚠️ a Lente 2 (os "momentos" do ciclo) ainda está aberta — esses 2 estágios podem virar mais/outros (iterar)
cursor:
  node: <q-NNN aberta | checkpoint ativo>
  note: "<o sub-ponto em discussão — uma linha>"
topology: [] # checkpoints com status (Stage 2)
next: <próximo movimento>
