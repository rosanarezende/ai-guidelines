        checkpoints:
          - cp-doctrine # nasce: domain/knowledge/Doctrine + DoctrineGraph + doctrine:check; arestas supersedes/grounds entram no grafo. dissolve: pilha-plana de ADRs como grep; retira .agents/. valor: "a resposta estava num ADR" vira navegação.
      - id: pr-decision
        github_pr: null
        role: execution
        terminal: false
        sequence: 4
        checkpoints:
          - cp-decision # nasce: domain/knowledge/Decision + decision:check (absorve GG-0001); aresta generalizedTo→Doctrine. dissolve: NEXT.md (insights→Insight feito; débitos→Decision-Deferred/WorkItem). valor: decisões/débitos navegáveis.
      - id: pr-rule-guardrail
        github_pr: null
        role: execution
        terminal: false
        sequence: 5
        checkpoints:
          - cp-rule-guardrail # nasce: Rule+Guardrail (enforcedBy/groundedIn) + rule:check. dissolve: seção GG e lifecycle do governance-foundation; CORE-*/GR-*→atributo scope. valor: "qual check enforça isto?" navegável.
      - id: pr-projection-split
