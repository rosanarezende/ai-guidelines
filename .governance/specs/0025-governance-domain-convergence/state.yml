        terminal: false
        sequence: 7
        checkpoints:
          - cp-workitem-registry # nasce: persistência do WorkItem registry (já existe em src/) + backlog=WorkItem(proposal) via PromoteWorkItem. dissolve: backlog .specify congelado; BacklogItem/Spec colapsam em kinds. valor: backlog queryável.
      - id: pr-dualroot-collapse
        github_pr: null
        role: execution
        terminal: true
        sequence: 8
        checkpoints:
          - cp-dualroot-collapse # dissolve: .specify como root de runtime (branch specify-legacy em ~10 arquivos); relocação das 9 specs concluídas p/ archive. DEP REAL (por isso último): ~10 consumidores + citações de ADR→.specify/researchs. valor: uma árvore (118 arq/2M) a menos no mapa.
